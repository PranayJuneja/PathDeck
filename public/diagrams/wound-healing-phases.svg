<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description"><title id="title">Wound healing is an overlap, not a switch</title><desc id="description">A staggered timeline shows overlapping phases of wound repair and their principal cellular and structural events.</desc><defs><marker id="slateArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#6a7a8c"/></marker><marker id="roseArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#9f4765"/></marker><marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#267b78"/></marker><marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#8170b5"/></marker></defs><rect width="1200" height="760" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="44" fill="#267b78" font-size="15" font-weight="700" text-anchor="start">PATH DECK  /  MECHANISMS</text><text x="44" y="91" fill="#203249" font-size="34" font-weight="700" text-anchor="start">Wound healing is an overlap, not a switch</text><text x="44" y="125" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Hemostasis, inflammation, proliferation and remodelling run into one another.</text><path d="M44 147H1156" fill="none" stroke="#d9e1e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M100,252 L1110,252" fill="none" stroke="#6a7a8c" stroke-width="3" marker-end="url(#slateArrow)"/><text x="90" y="214" fill="#9f4765" font-size="18" font-weight="700" text-anchor="start">INJURY</text><text x="1110" y="214" fill="#267b78" font-size="18" font-weight="700" text-anchor="end">MATURATION</text><rect x="85" y="300" width="210" height="65" rx="15" fill="#ffffff" stroke="#9f4765" stroke-width="2"/><text x="103" y="328" fill="#203249" font-size="22" font-weight="650" text-anchor="start">Hemostasis</text><text x="103" y="352" fill="#6a7a8c" font-size="16" font-weight="400" text-anchor="start">Platelet plug and fibrin clot</text><rect x="225" y="387" width="390" height="65" rx="15" fill="#ffffff" stroke="#8170b5" stroke-width="2"/><text x="243" y="415" fill="#203249" font-size="22" font-weight="650" text-anchor="start">Inflammation</text><text x="243" y="439" fill="#6a7a8c" font-size="16" font-weight="400" text-anchor="start">Neutrophils, then macrophages clear debris</text><rect x="410" y="474" width="490" height="65" rx="15" fill="#ffffff" stroke="#9f4765" stroke-width="2"/><text x="428" y="502" fill="#203249" font-size="22" font-weight="650" text-anchor="start">Proliferation</text><text x="428" y="526" fill="#6a7a8c" font-size="16" font-weight="400" text-anchor="start">Granulation tissue, angiogenesis and re-epithelialisation</text><rect x="680" y="561" width="450" height="65" rx="15" fill="#ffffff" stroke="#267b78" stroke-width="2"/><text x="698" y="589" fill="#203249" font-size="22" font-weight="650" text-anchor="start">Remodelling</text><text x="698" y="613" fill="#6a7a8c" font-size="16" font-weight="400" text-anchor="start">Collagen reorganisation and scar maturation</text><text x="95" y="675" fill="#6a7a8c" font-size="17" font-weight="400" text-anchor="start">Immediate</text><text x="415" y="675" fill="#6a7a8c" font-size="17" font-weight="400" text-anchor="start">Days</text><text x="770" y="675" fill="#6a7a8c" font-size="17" font-weight="400" text-anchor="start">Weeks to months</text><path d="M44 693H1156" fill="none" stroke="#d9e1e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="720" fill="#6a7a8c" font-size="17" font-weight="400" text-anchor="start">Timing varies with wound size, site, infection, perfusion and the patient’s health.</text><text x="44" y="746" fill="#6a7a8c" font-size="14" font-weight="400" text-anchor="start">Schematic • not a photomicrograph</text><text x="1156" y="746" fill="#6a7a8c" font-size="14" font-weight="400" text-anchor="end">Original Path Deck illustration · CC BY 4.0</text></g></svg>