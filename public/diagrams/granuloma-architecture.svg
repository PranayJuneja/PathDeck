nt-weight="650" text-anchor="middle">Necrotic centre</text><text x="410" y="430" fill="#6a7a8c" font-size="19" font-weight="400" text-anchor="middle">may be present</text><path d="M702,275 L755,240" fill="none" stroke="#8170b5" stroke-width="3" marker-end="url(#purpleArrow)"/><rect x="780" y="190" width="365" height="105" rx="16" fill="#e7e1f3" stroke="#d9e1e9" stroke-width="2"/><rect x="781" y="191" width="6" height="103" rx="3" fill="#8170b5" stroke="#8170b5" stroke-width="2"/><text x="803" y="227" fill="#203249" font-size="24" font-weight="650" text-anchor="start">Lymphocyte cuff</text><text x="803" y="262" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">A variable surrounding rim</text><path d="M654,390 L755,383" fill="none" stroke="#9f4765" stroke-width="3" marker-end="url(#roseArrow)"/><rect x="780" y="335" width="365" height="120" rx="16" fill="#f3dce4" stroke="#d9e1e9" stroke-width="2"/><rect x="781" y="336" width="6" height="118" rx="3" fill="#9f4765" stroke="#9f4765" stroke-width="2"/><text x="803" y="372" fill="#203249" font-size="24" font-weight="650" text-anchor="start">Epithelioid macrophages</text><text x="803" y="407" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Activated macrophages form</text><text x="803" y="436" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">the main cellular</text><text x="803" y="465" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">aggregate.</text><path d="M602,428 L755,535" fill="none" stroke="#9f4765" stroke-width="3" marker-end="url(#roseArrow)"/><rect x="780" y="495" width="365" height="130" rx="16" fill="#ffffff" stroke="#d9e1e9" stroke-width="2"/><rect x="781" y="496" width="6" height="128" rx="3" fill="#9f4765" stroke="#9f4765" stroke-width="2"/><text x="803" y="532" fill="#203249" font-size="24" font-weight="650" text-anchor="start">Multinucleated giant cells</text><text x="803" y="567" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Fusion of macrophages;</text><text x="803" y="596" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">nuclear arrangement varies.</text><path d="M44 693H1156" fill="none" stroke="#d9e1e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="720" fill="#6a7a8c" font-size="17" font-weight="400" text-anchor="start">Caseation supports a differential diagnosis; granulomas alone do not prove tuberculosis.</text><text x="44" y="746" fill="#6a7a8c" font-size="14" font-weight="400" text-anchor="start">Schematic • not a photomicrograph</text><text x="1156" y="746" fill="#6a7a8c" font-size="14" font-weight="400" text-anchor="end">Original Path Deck illustration · CC BY 4.0</text></g></svg>