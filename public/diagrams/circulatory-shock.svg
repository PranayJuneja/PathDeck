<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description"><title id="title">Circulatory shock: inadequate tissue perfusion</title><desc id="description">Four mechanisms of shock converge on insufficient tissue oxygenation and cellular dysfunction. Blood pressure alone does not define shock.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#6a7a8c" /></marker></defs><rect x="0" y="0" width="1200" height="760" rx="0" fill="#f5f7fa" stroke="#f5f7fa" stroke-width="2" /><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="44" font-size="15" fill="#267b78" font-weight="700" text-anchor="start">PATH DECK  /  MECHANISMS</text><text x="44" y="91" font-size="32" fill="#203249" font-weight="700" text-anchor="start">Circulatory shock: inadequate tissue perfusion</text><text x="44" y="125" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">Different circulatory failures can produce a shared tissue-level emergency.</text><path d="M44 147 L1156 147" stroke="#d9e1e9" stroke-width="3" fill="none" /><path d="M44 693 L1156 693" stroke="#d9e1e9" stroke-width="3" fill="none" /><text x="44" y="720" font-size="17" fill="#6a7a8c" font-weight="400" text-anchor="start">Hypotension alone does not define shock; mixed mechanisms can coexist.</text><text x="44" y="746" font-size="14" fill="#6a7a8c" font-weight="400" text-anchor="start">Schematic • not a photomicrograph</text><text x="1156" y="746" font-size="14" fill="#6a7a8c" font-weight="400" text-anchor="end">Original Path Deck illustration · CC BY 4.0</text><rect x="44" y="180" width="260" height="170" rx="14" fill="#f3dce4" stroke="#d9e1e9" stroke-width="2" /><text x="64" y="217" font-size="24" fill="#203249" font-weight="650" text-anchor="start">Hypovolemic</text><text x="64" y="253" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">Low circulating volume</text><text x="64" y="280" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">reduces venous return</text><text x="64" y="307" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">and cardiac output.</text><path d="M174 350L600 405" stroke="#6a7a8c" stroke-width="3" fill="none" marker-end="url(#arr)" /><rect x="328" y="180" width="260" height="170" rx="14" fill="#e6e1f2" stroke="#d9e1e9" stroke-width="2" /><text x="348" y="217" font-size="24" fill="#203249" font-weight="650" text-anchor="start">Cardiogenic</text><text x="348" y="253" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">Pump dysfunction</text><text x="348" y="280" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">reduces effective</text><text x="348" y="307" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">cardiac output.</text><path d="M458 350L600 405" stroke="#6a7a8c" stroke-width="3" fill="none" marker-end="url(#arr)" /><rect x="612" y="180" width="260" height="170" rx="14" fill="#dff0ee" stroke="#d9e1e9" stroke-width="2" /><text x="632" y="217" font-size="24" fill="#203249" font-weight="650" text-anchor="start">Obstructive</text><text x="632" y="253" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">Mechanical restriction</text><text x="632" y="280" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">impairs cardiac filling</text><text x="632" y="307" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">or forward blood flow.</text><path d="M742 350L600 405" stroke="#6a7a8c" stroke-width="3" fill="none" marker-end="url(#arr)" /><rect x="896" y="180" width="260" height="170" rx="14" fill="#fff" stroke="#d9e1e9" stroke-width="2" /><text x="916" y="217" font-size="24" fill="#203249" font-weight="650" text-anchor="start">Distributive</text><text x="916" y="253" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">Vasodilation and</text><text x="916" y="280" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">maldistributed flow;</text><text x="916" y="307" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">output may be high.</text><path d="M1026 350L600 405" stroke="#6a7a8c" stroke-width="3" fill="none" marker-end="url(#arr)" /><rect x="245" y="412" width="710" height="89" rx="14" fill="#f3dce4" stroke="#d9e1e9" stroke-width="2" /><text x="600" y="448" font-size="26" fill="#203249" font-weight="650" text-anchor="middle">Inadequate tissue perfusion / oxygenation</text><text x="600" y="480" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="middle">Delivery and cellular oxygen use may both be impaired.</text><path d="M600 501L230 548" stroke="#6a7a8c" stroke-width="3" fill="none" marker-end="url(#arr)" /><rect x="55" y="558" width="350" height="117" rx="14" fill="#fff" stroke="#d9e1e9" stroke-width="2" /><text x="75" y="595" font-size="24" fill="#203249" font-weight="650" text-anchor="start">Cellular energy failure</text><text x="75" y="631" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">Impaired oxidative</text><text x="75" y="658" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">ATP generation.</text><path d="M600 501L600 548" stroke="#6a7a8c" stroke-width="3" fill="none" marker-end="url(#arr)" /><rect x="425" y="558" width="350" height="117" rx="14" fill="#fff" stroke="#d9e1e9" stroke-width="2" /><text x="445" y="595" font-size="24" fill="#203249" font-weight="650" text-anchor="start">Lactate may rise</text><text x="445" y="631" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">A supporting marker;</text><text x="445" y="658" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">not specific for shock.</text><path d="M600 501L970 548" stroke="#6a7a8c" stroke-width="3" fill="none" marker-end="url(#arr)" /><rect x="795" y="558" width="350" height="117" rx="14" fill="#fff" stroke="#d9e1e9" stroke-width="2" /><text x="815" y="595" font-size="24" fill="#203249" font-weight="650" text-anchor="start">Organ dysfunction</text><text x="815" y="631" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">Altered mentation, low</text><text x="815" y="658" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">urine output and injury.</text></g></svg>