<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description"><title id="title">Why fluid accumulates in tissues</title><desc id="description">Capillary hydrostatic and oncotic influences are shown with lymphatic drainage and common mechanisms of edema.</desc><defs><marker id="slateArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#6a7a8c" /></marker><marker id="roseArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#9f4765" /></marker><marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#267b78" /></marker><marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#8170b5" /></marker></defs><rect width="1200" height="760" fill="#f5f7fa" /><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="44" fill="#267b78" font-size="15" font-weight="700" text-anchor="start">PATH DECK  /  MECHANISMS</text><text x="44" y="91" fill="#203249" font-size="34" font-weight="700" text-anchor="start">Why fluid accumulates in tissues</text><text x="44" y="125" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Edema develops when filtration exceeds lymphatic clearance.</text><path d="M44 147H1156" fill="none" stroke="#d9e1e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="325" y="200" width="550" height="120" rx="55" fill="#f3dce4" stroke="#9f4765" stroke-width="2" /><text x="600" y="270" fill="#9f4765" font-size="24" font-weight="700" text-anchor="middle">CAPILLARY</text><path d="M435,320 L435,410" fill="none" stroke="#9f4765" stroke-width="3" marker-end="url(#roseArrow)" /><text x="315" y="449" fill="#9f4765" font-size="22" font-weight="650" text-anchor="start">Hydrostatic pressure</text><text x="335" y="478" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">favours filtration</text><path d="M760,410 L760,320" fill="none" stroke="#8170b5" stroke-width="3" marker-end="url(#purpleArrow)" /><text x="659" y="449" fill="#8170b5" font-size="22" font-weight="650" text-anchor="start">Plasma proteins</text><text x="650" y="478" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">oppose fluid escape</text><path d="M115 545Q600 625 1085 545" fill="none" stroke="#267b78" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><path d="M755,575 L1055,555" fill="none" stroke="#267b78" stroke-width="3" marker-end="url(#tealArrow)" /><text x="600" y="620" fill="#267b78" font-size="23" font-weight="650" text-anchor="middle">Lymphatic drainage returns filtered fluid</text><rect x="48" y="179" width="245" height="192" rx="16" fill="#ffffff" stroke="#d9e1e9" stroke-width="2" /><rect x="49" y="180" width="6" height="190" rx="3" fill="#9f4765" stroke="#9f4765" stroke-width="2" /><text x="71" y="216" fill="#203249" font-size="24" font-weight="650" text-anchor="start">More fluid out</text><text x="71" y="251" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Raised venous</text><text x="71" y="280" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">pressure or</text><text x="71" y="309" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">greater vascular</text><text x="71" y="338" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">permeability</text><rect x="907" y="179" width="245" height="192" rx="16" fill="#ffffff" stroke="#d9e1e9" stroke-width="2" /><rect x="908" y="180" width="6" height="190" rx="3" fill="#267b78" stroke="#267b78" stroke-width="2" /><text x="930" y="216" fill="#203249" font-size="24" font-weight="650" text-anchor="start">Less clearance</text><path d="M44 693H1156" fill="none" stroke="#d9e1e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="44" y="720" fill="#6a7a8c" font-size="17" font-weight="400" text-anchor="start">Sodium and water retention can amplify edema; inflammatory exudates contain more protein.</text><text x="44" y="746" fill="#6a7a8c" font-size="14" font-weight="400" text-anchor="start">Schematic • not a photomicrograph</text><text x="1156" y="746" fill="#6a7a8c" font-size="14" font-weight="400" text-anchor="end">Original Path Deck illustration · CC BY 4.0</text><text x="930" y="251" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Lymphatic</text><text x="930" y="280" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">obstruction</text><text x="930" y="309" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">reduces removal</text><text x="930" y="338" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">of interstitial</text><text x="930" y="367" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">fluid.</text><text x="650" y="508" fill="#8170b5" font-size="18" font-weight="400" text-anchor="start">Low albumin weakens this restraint</text></g></svg>