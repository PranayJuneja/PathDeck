<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description"><title id="title">Vitamin D and bone mineralisation</title><desc id="description">Vitamin D activation in liver and kidney supports intestinal mineral absorption; a simplified osteoid comparison explains inadequate mineralisation in rickets and osteomalacia.</desc><defs><marker id="slateArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#6a7a8c"/></marker><marker id="roseArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#9f4765"/></marker><marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#267b78"/></marker><marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#8170b5"/></marker></defs><rect width="1200" height="760" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="44" fill="#267b78" font-size="15" font-weight="700" text-anchor="start">PATH DECK  /  MECHANISMS</text><text x="44" y="91" fill="#203249" font-size="34" font-weight="700" text-anchor="start">Vitamin D and bone mineralisation</text><text x="44" y="125" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Activation links vitamin supply, mineral availability and the mineralisation of osteoid.</text><path d="M44 147H1156" fill="none" stroke="#d9e1e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="45" y="179" width="300" height="129" rx="16" fill="#ffffff" stroke="#d9e1e9" stroke-width="2"/><rect x="46" y="180" width="6" height="127" rx="3" fill="#267b78" stroke="#267b78" stroke-width="2"/><text x="67" y="215" fill="#203249" font-size="24" font-weight="650" text-anchor="start">Vitamin D supply</text><text x="67" y="249" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Skin synthesis and</text><text x="67" y="276" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">dietary sources</text><path d="M345 242L420 242" fill="none" stroke="#267b78" stroke-width="3" marker-end="url(#tealArrow)"/><rect x="450" y="179" width="300" height="129" rx="16" fill="#e7e1f3" stroke="#d9e1e9" stroke-width="2"/><rect x="451" y="180" width="6" height="127" rx="3" fill="#8170b5" stroke="#8170b5" stroke-width="2"/><text x="472" y="215" fill="#203249" font-size="24" font-weight="650" text-anchor="start">Liver</text><text x="472" y="249" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Forms</text><text x="472" y="276" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">25-hydroxyvitamin D</text><path d="M750 242L825 242" fill="none" stroke="#8170b5" stroke-width="3" marker-end="url(#purpleArrow)"/><rect x="855" y="179" width="300" height="129" rx="16" fill="#deefeb" stroke="#d9e1e9" stroke-width="2"/><rect x="856" y="180" width="6" height="127" rx="3" fill="#267b78" stroke="#267b78" stroke-width="2"/><text x="877" y="215" fill="#203249" font-size="24" font-weight="650" text-anchor="start">Kidney</text><text x="877" y="249" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Forms active</text><text x="877" y="276" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">calcitriol</text><path d="M1005 309L1005 355" fill="none" stroke="#267b78" stroke-width="3" marker-end="url(#tealArrow)"/><rect x="680" y="380" width="475" height="125" rx="16" fill="#deefeb" stroke="#d9e1e9" stroke-width="2"/><rect x="681" y="381" width="6" height="123" rx="3" fill="#267b78" stroke="#267b78" stroke-width="2"/><text x="702" y="416" fill="#203249" font-size="24" font-weight="650" text-anchor="start">Intestinal mineral absorption</text><text x="702" y="450" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Active vitamin D supports calcium and</text><text x="702" y="477" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">phosphate availability.</text><rect x="45" y="356" width="575" height="291" rx="16" fill="#ffffff" stroke="#d9e1e9" stroke-width="2"/><text x="75" y="394" fill="#203249" font-size="25" font-weight="650" text-anchor="start">Bone mineralisation</text><text x="75" y="433" fill="#6a7a8c" font-size="20" font-weight="650" text-anchor="start">Adequate mineral</text><rect x="75" y="456" width="210" height="26" rx="5" fill="#f3dce4" stroke="#9f4765" stroke-width="2"/><circle cx="91" cy="469" r="5" fill="#267b78" stroke="#267b78" stroke-width="2"/><circle cx="116" cy="469" r="5" fill="#267b78" stroke="#267b78" stroke-width="2"/><circle cx="141" cy="469" r="5" fill="#267b78" stroke="#267b78" stroke-width="2"/><circle cx="166" cy="469" r="5" fill="#267b78" stroke="#267b78" stroke-width="2"/><circle cx="191" cy="469" r="5" fill="#267b78" stroke="#267b78" stroke-width="2"/><circle cx="216" cy="469" r="5" fill="#267b78" stroke="#267b78" stroke-width="2"/><circle cx="241" cy="469" r="5" fill="#267b78" stroke="#267b78" stroke-width="2"/><circle cx="266" cy="469" r="5" fill="#267b78" stroke="#267b78" stroke-width="2"/><rect x="75" y="496" width="210" height="26" rx="5" fill="#f3dce4" stroke="#9f4765" stroke-width="2"/><circle cx="91" cy="509" r="5" fill="#267b78" stroke="#267b78" stroke-width="2"/><circle cx="116" cy="509" r="5" fill="#267b78" stroke="#267b78" stroke-width="2"/><circle cx="141" cy="509" r="5" fill="#267b78" stroke="#267b78" stroke-width="2"/><circle cx="166" cy="509" r="5" fill="#267b78" stroke="#267b78" stroke-width="2"/><circle cx="191" cy="509" r="5" fill="#267b78" stroke="#267b78" stroke-width="2"/><circle cx="216" cy="509" r="5" fill="#267b78" stroke="#267b78" stroke-width="2"/><circle cx="241" cy="509" r="5" fill="#267b78" stroke="#267b78" stroke-width="2"/><circle cx="266" cy="509" r="5" fill="#267b78" stroke="#267b78" stroke-width="2"/><rect x="75" y="536" width="210" height="26" rx="5" fill="#f3dce4" stroke="#9f4765" stroke-width="2"/><circle cx="91" cy="549" r="5" fill="#267b78" stroke="#267b78" stroke-width="2"/><circle cx="116" cy="549" r="5" fill="#267b78" stroke="#267b78" stroke-width="2"/><circle cx="141" cy="549" r="5" fill="#267b78" stroke="#267b78" stroke-width="2"/><circle cx="166" cy="549" r="5" fill="#267b78" stroke="#267b78" stroke-width="2"/><circle cx="191" cy="549" r="5" fill="#267b78" stroke="#267b78" stroke-width="2"/><circle cx="216" cy="549" r="5" fill="#267b78" stroke="#267b78" stroke-width="2"/><circle cx="241" cy="549" r="5" fill="#267b78" stroke="#267b78" stroke-width="2"/><circle cx="266" cy="549" r="5" fill="#267b78" stroke="#267b78" stroke-width="2"/><text x="350" y="433" fill="#6a7a8c" font-size="20" font-weight="650" text-anchor="start">Poorly mineralised</text><rect x="350" y="456" width="210" height="26" rx="5" fill="#f3dce4" stroke="#9f4765" stroke-width="2"/><circle cx="366" cy="469" r="5" fill="#267b78" stroke="#267b78" stroke-width="2"/><circle cx="466" cy="469" r="5" fill="#267b78" stroke="#267b78" stroke-width="2"/><rect x="350" y="496" width="210" height="26" rx="5" fill="#f3dce4" stroke="#9f4765" stroke-width="2"/><circle cx="366" cy="509" r="5" fill="#267b78" stroke="#267b78" stroke-width="2"/><circle cx="466" cy="509" r="5" fill="#267b78" stroke="#267b78" stroke-width="2"/><rect x="350" y="536" width="210" height="26" rx="5" fill="#f3dce4" stroke="#9f4765" stroke-width="2"/><circle cx="366" cy="549" r="5" fill="#267b78" stroke="#267b78" stroke-width="2"/><circle cx="466" cy="549" r="5" fill="#267b78" stroke="#267b78" stroke-width="2"/><text x="75" y="617" fill="#6a7a8c" font-size="18" font-weight="400" text-anchor="start">Dots represent mineral within new osteoid.</text><path d="M680 442L642 442" fill="none" stroke="#267b78" stroke-width="3" marker-end="url(#tealArrow)"/><rect x="680" y="547" width="475" height="100" rx="16" fill="#f3dce4" stroke="#d9e1e9" stroke-width="2"/><rect x="681" y="548" width="6" height="98" rx="3" fill="#9f4765" stroke="#9f4765" stroke-width="2"/><text x="702" y="583" fill="#203249" font-size="24" font-weight="650" text-anchor="start">Deficiency can impair mineralisation</text><text x="702" y="617" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Rickets in growing children;</text><text x="702" y="644" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">osteomalacia in adults.</text><path d="M44 693H1156" fill="none" stroke="#d9e1e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="720" fill="#6a7a8c" font-size="17" font-weight="400" text-anchor="start">This shows a mechanism of nutritional deficiency; rickets can also have non-nutritional causes.</text><text x="44" y="746" fill="#6a7a8c" font-size="14" font-weight="400" text-anchor="start">Schematic • not a photomicrograph</text><text x="1156" y="746" fill="#6a7a8c" font-size="14" font-weight="400" text-anchor="end">Original Path Deck illustration · CC BY 4.0</text></g></svg>