<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description"><title id="title">When chromosome segregation fails</title><desc id="description">A simplified segregation diagram contrasts balanced gametes with gametes that gain or lose a chromosome after nondisjunction, which can produce aneuploidy following fertilisation.</desc><defs><marker id="slateArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#6a7a8c" /></marker><marker id="roseArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#9f4765" /></marker><marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#267b78" /></marker><marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#8170b5" /></marker></defs><rect width="1200" height="760" fill="#f5f7fa" /><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="44" fill="#267b78" font-size="15" font-weight="700" text-anchor="start">PATH DECK  /  MECHANISMS</text><text x="44" y="91" fill="#203249" font-size="34" font-weight="700" text-anchor="start">When chromosome segregation fails</text><text x="44" y="125" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Only one representative chromosome pair and selected gametes are shown.</text><path d="M44 147H1156" fill="none" stroke="#d9e1e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="55" y="176" width="520" height="430" rx="16" fill="#ffffff" stroke="#d9e1e9" stroke-width="2" /><rect x="625" y="176" width="520" height="430" rx="16" fill="#ffffff" stroke="#d9e1e9" stroke-width="2" /><text x="315" y="219" fill="#203249" font-size="26" font-weight="650" text-anchor="middle">Balanced segregation</text><text x="885" y="219" fill="#203249" font-size="26" font-weight="650" text-anchor="middle">Nondisjunction</text><circle cx="315" cy="301" r="57" fill="#ffffff" stroke="#d9e1e9" stroke-width="2" /><rect x="292" y="271" width="14" height="60" rx="7" fill="#8170b5" stroke="#8170b5" stroke-width="2" /><rect x="325" y="271" width="14" height="60" rx="7" fill="#9f4765" stroke="#9f4765" stroke-width="2" /><circle cx="885" cy="301" r="57" fill="#ffffff" stroke="#d9e1e9" stroke-width="2" /><rect x="862" y="271" width="14" height="60" rx="7" fill="#8170b5" stroke="#8170b5" stroke-width="2" /><rect x="895" y="271" width="14" height="60" rx="7" fill="#9f4765" stroke="#9f4765" stroke-width="2" /><path d="M315 360L165 416" fill="none" stroke="#6a7a8c" stroke-width="3" marker-end="url(#slateArrow)" /><path d="M315 360L465 416" fill="none" stroke="#6a7a8c" stroke-width="3" marker-end="url(#slateArrow)" /><path d="M885 360L735 416" fill="none" stroke="#6a7a8c" stroke-width="3" marker-end="url(#slateArrow)" /><path d="M885 360L1035 416" fill="none" stroke="#6a7a8c" stroke-width="3" marker-end="url(#slateArrow)" /><circle cx="165" cy="466" r="51" fill="#ffffff" stroke="#d9e1e9" stroke-width="2" /><circle cx="465" cy="466" r="51" fill="#ffffff" stroke="#d9e1e9" stroke-width="2" /><circle cx="735" cy="466" r="51" fill="#ffffff" stroke="#d9e1e9" stroke-width="2" /><circle cx="1035" cy="466" r="51" fill="#ffffff" stroke="#d9e1e9" stroke-width="2" /><rect x="158" y="436" width="14" height="60" rx="7" fill="#8170b5" stroke="#8170b5" stroke-width="2" /><rect x="458" y="436" width="14" height="60" rx="7" fill="#9f4765" stroke="#9f4765" stroke-width="2" /><rect x="712" y="436" width="14" height="60" rx="7" fill="#8170b5" stroke="#8170b5" stroke-width="2" /><rect x="742" y="436" width="14" height="60" rx="7" fill="#9f4765" stroke="#9f4765" stroke-width="2" /><text x="165" y="551" fill="#203249" font-size="24" font-weight="650" text-anchor="middle">n</text><text x="465" y="551" fill="#203249" font-size="24" font-weight="650" text-anchor="middle">n</text><text x="735" y="551" fill="#203249" font-size="24" font-weight="650" text-anchor="middle">n + 1</text><text x="1035" y="551" fill="#203249" font-size="24" font-weight="650" text-anchor="middle">n − 1</text><text x="315" y="582" fill="#6a7a8c" font-size="19" font-weight="400" text-anchor="middle">One copy of this chromosome per gamete</text><text x="885" y="582" fill="#6a7a8c" font-size="19" font-weight="400" text-anchor="middle">Extra copy or missing copy in a gamete</text><rect x="120" y="615" width="960" height="66" rx="16" fill="#ffffff" stroke="#d9e1e9" stroke-width="2" /><rect x="121" y="616" width="6" height="64" rx="3" fill="#8170b5" stroke="#8170b5" stroke-width="2" /><text x="142" y="648" fill="#203249" font-size="21" font-weight="650" text-anchor="start">Fertilisation may produce trisomy (2n + 1) or monosomy (2n − 1)</text><path d="M44 693H1156" fill="none" stroke="#d9e1e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="44" y="720" fill="#6a7a8c" font-size="17" font-weight="400" text-anchor="start">Chromosome replication and other pairs are omitted. Translocations and mosaicism are other mechanisms.</text><text x="44" y="746" fill="#6a7a8c" font-size="14" font-weight="400" text-anchor="start">Schematic • not a photomicrograph</text><text x="1156" y="746" fill="#6a7a8c" font-size="14" font-weight="400" text-anchor="end">Original Path Deck illustration · CC BY 4.0</text><text x="142" y="671" fill="#6a7a8c" font-size="18" font-weight="400" text-anchor="start">Examples include trisomy 21 (Down syndrome) and 45,X (Turner syndrome).</text></g></svg>