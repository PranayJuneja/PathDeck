<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description"><title id="title">Aplastic anemia: marrow failure across blood cell lines</title><desc id="description">Cellular marrow is contrasted with hypocellular fat-rich marrow. Stem-cell injury reduces erythrocyte, leukocyte and platelet production, unlike isolated red-cell aplasia.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#6a7a8c" /></marker></defs><rect x="0" y="0" width="1200" height="760" rx="0" fill="#f5f7fa" stroke="#f5f7fa" stroke-width="2" /><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="44" font-size="15" fill="#267b78" font-weight="700" text-anchor="start">PATH DECK  /  MECHANISMS</text><text x="44" y="91" font-size="31" fill="#203249" font-weight="700" text-anchor="start">Aplastic anemia: marrow failure across blood cell lines</text><text x="44" y="125" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">Stem-cell injury reduces marrow production and can produce pancytopenia.</text><path d="M44 147 L1156 147" stroke="#d9e1e9" stroke-width="3" fill="none" /><path d="M44 693 L1156 693" stroke="#d9e1e9" stroke-width="3" fill="none" /><text x="44" y="720" font-size="17" fill="#6a7a8c" font-weight="400" text-anchor="start">Cellularity varies with age; these fields are illustrative, not quantitative diagnostic cutoffs.</text><text x="44" y="746" font-size="14" fill="#6a7a8c" font-weight="400" text-anchor="start">Schematic • not a photomicrograph</text><text x="1156" y="746" font-size="14" fill="#6a7a8c" font-weight="400" text-anchor="end">Original Path Deck illustration · CC BY 4.0</text><rect x="55" y="180" width="480" height="300" rx="14" fill="#fff" stroke="#d9e1e9" stroke-width="2" /><rect x="665" y="180" width="480" height="300" rx="14" fill="#fff" stroke="#d9e1e9" stroke-width="2" /><text x="295" y="218" font-size="