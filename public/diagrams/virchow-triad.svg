<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description"><title id="title">Virchow’s triad</title><desc id="description">Triangle links endothelial injury, abnormal blood flow and hypercoagulability to increased thrombus risk.</desc><defs><marker id="slateArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#6a7a8c"/></marker><marker id="roseArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#9f4765"/></marker><marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#267b78"/></marker><marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#8170b5"/></marker></defs><rect width="1200" height="760" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="44" fill="#267b78" font-size="15" font-weight="700" text-anchor="start">PATH DECK  /  MECHANISMS</text><text x="44" y="91" fill="#203249" font-size="34" font-weight="700" text-anchor="start">Virchow’s triad</text><text x="44" y="125" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Three interacting contributors to pathological thrombosis.</text><path d="M44 147H1156" fill="none" stroke="#d9e1e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M600 230L240 560H960Z" fill="none" stroke="#d9e1e9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="600" cy="420" r="94" fill="#f3dce4" stroke="#9f4765" stroke-width="2"/><text x="600" y="415" fill="#9f4765" font-size="24" font-weight="700" text-anchor="middle">THROMBUS</text><text x="600" y="446" fill="#203249" font-size="18" font-weight="400" text-anchor="middle">risk increases</text><rect x="395" y="173" width="410" height="115" rx="16" fill="#f3dce4" stroke="#d9e1e9" stroke-width="2"/><rect x="396" y="174" width="6" height="113" rx="3" fill="#9f4765" stroke="#9f4765" stroke-width="2"/><text x="418" y="210" fill="#203249" font-size="24" font-weight="650" text-anchor="start">Endothelial injury</text><text x="418" y="245" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Damage or dysfunction promotes</text><text x="418" y="274" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">thrombosis.</text><rect x="55" y="505" width="425" height="135" rx="16" fill="#e7e1f3" stroke="#d9e1e9" stroke-width="2"/><rect x="56" y="506" width="6" height="133" rx="3" fill="#8170b5" stroke="#8170b5" stroke-width="2"/><text x="78" y="542" fill="#203249" font-size="24" font-weight="650" text-anchor="start">Abnormal blood flow</text><text x="78" y="577" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Stasis or turbulence favours</text><text x="78" y="606" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">local clot formation.</text><rect x="720" y="505" width="425" height="135" rx="16" fill="#deefeb" stroke="#d9e1e9" stroke-width="2"/><rect x="721" y="506" width="6" height="133" rx="3" fill="#267b78" stroke="#267b78" stroke-width="2"/><text x="743" y="542" fill="#203249" font-size="24" font-weight="650" text-anchor="start">Hypercoagulability</text><text x="743" y="577" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Inherited or acquired changes</text><text x="743" y="606" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">shift the clotting balance.</text><path d="M600,289 L600,320" fill="none" stroke="#9f4765" stroke-width="3" marker-end="url(#roseArrow)"/><path d="M385,505 L516,465" fill="none" stroke="#8170b5" stroke-width="3" marker-end="url(#purpleArrow)"/><path d="M817,505 L688,465" fill="none" stroke="#267b78" stroke-width="3" marker-end="url(#tealArrow)"/><path d="M44 693H1156" fill="none" stroke="#d9e1e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="720" fill="#6a7a8c" font-size="17" font-weight="400" text-anchor="start">The contributors interact; all three do not need to be demonstrable in every thrombus.</text><text x="44" y="746" fill="#6a7a8c" font-size="14" font-weight="400" text-anchor="start">Schematic • not a photomicrograph</text><text x="1156" y="746" fill="#6a7a8c" font-size="14" font-weight="400" text-anchor="end">Original Path Deck illustration · CC BY 4.0</text></g></svg>