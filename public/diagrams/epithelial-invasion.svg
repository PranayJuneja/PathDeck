<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description"><title id="title">The boundary that defines invasion</title><desc id="description">Comparison of an epithelial proliferation confined above an intact basement membrane with malignant cells penetrating into underlying stroma.</desc><defs><marker id="slateArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#6a7a8c"/></marker><marker id="roseArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#9f4765"/></marker><marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#267b78"/></marker><marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#8170b5"/></marker></defs><rect width="1200" height="760" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="44" fill="#267b78" font-size="15" font-weight="700" text-anchor="start">PATH DECK  /  MECHANISMS</text><text x="44" y="91" fill="#203249" font-size="34" font-weight="700" text-anchor="start">The boundary that defines invasion</text><text x="44" y="125" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">For epithelial lesions, stromal invasion requires breach of the basement membrane.</text><path d="M44 147H1156" fill="none" stroke="#d9e1e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="55" y="180" width="520" height="450" rx="16" fill="#ffffff" stroke="#d9e1e9" stroke-width="2"/><rect x="625" y="180" width="520" height="450" rx="16" fill="#ffffff" stroke="#d9e1e9" stroke-width="2"/><text x="315" y="218" fill="#203249" font-size="25" font-weight="650" text-anchor="middle">Confined