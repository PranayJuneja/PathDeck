512" r="22" fill="#e7e1f3" stroke="#9f4765" stroke-width="2"/><circle cx="867" cy="512" r="7.48" fill="#8170b5" stroke="#8170b5" stroke-width="1"/><circle cx="934" cy="550" r="22" fill="#e7e1f3" stroke="#9f4765" stroke-width="2"/><circle cx="934" cy="550" r="7.48" fill="#8170b5" stroke="#8170b5" stroke-width="1"/><path d="M925,395 L965,485" fill="none" stroke="#9f4765" stroke-width="3" marker-end="url(#roseArrow)"/><text x="315" y="470" fill="#267b78" font-size="22" font-weight="650" text-anchor="middle">Basement membrane intact</text><text x="95" y="520" fill="#6a7a8c" font-size="21" font-weight="400" text-anchor="start">No stromal invasion is shown.</text><text x="95" y="549" fill="#6a7a8c" font-size="21" font-weight="400" text-anchor="start">Architecture and cytology still</text><text x="95" y="578" fill="#6a7a8c" font-size="21" font-weight="400" text-anchor="start">require assessment.</text><text x="885" y="601" fill="#9f4765" font-size="22" font-weight="650" text-anchor="middle">Tumour cells invade stroma</text><path d="M44 693H1156" fill="none" stroke="#d9e1e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="720" fill="#6a7a8c" font-size="17" font-weight="400" text-anchor="start">Atypia alone does not prove invasion. In-situ carcinoma remains above the basement membrane.</text><text x="44" y="746" fill="#6a7a8c" font-size="14" font-weight="400" text-anchor="start">Schematic • not a photomicrograph</text><text x="1156" y="746" fill="#6a7a8c" font-size="14" font-weight="400" text-anchor="end">Original Path Deck illustration · CC BY 4.0</text></g></svg>