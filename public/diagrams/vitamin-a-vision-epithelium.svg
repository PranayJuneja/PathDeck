<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description"><title id="title">Vitamin A deficiency: vision and epithelial injury</title><desc id="description">Two parallel mechanisms connect vitamin A deficiency with impaired retinal function and loss of normal ocular epithelial maintenance.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#6a7a8c" /></marker></defs><rect x="0" y="0" width="1200" height="760" rx="0" fill="#f5f7fa" stroke="#f5f7fa" stroke-width="2" /><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="44" font-size="15" fill="#267b78" font-weight="700" text-anchor="start">PATH DECK  /  MECHANISMS</text><text x="44" y="91" font-size="32" fill="#203249" font-weight="700" text-anchor="start">Vitamin A deficiency: vision and epithelial injury</text><text x="44" y="125" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">Retinal light responses and ocular surface maintenance are related but distinct roles.</text><path d="M44 147 L1156 147" stroke="#d9e1e9" stroke-width="3" fill="none" /><rect x="370" y="175" width="460" height="105" rx="14" fill="#f3dce4" stroke="#d9e1e9" stroke-width="2" /><text x="392" y="211" font-size="24" fill="#203249" font-weight="650" text-anchor="start">Inadequate vitamin A availability</text><text x="392" y="248" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">Reduced support for vision and</text><path d="M470 280 L300 342" stroke="#6a7a8c" stroke-width="3" fill="none" marker-end="url(#arr)" /><path d="M730 280 L910 342" stroke="#6a7a8c" stroke-width="3" fill="none" marker-end="url(#arr)" /><rect x="55" y="350" width="510" height="285" rx="14" fill="white" stroke="#d9e1e9" stroke-width="2" /><rect x="635" y="350" width="510" height="285" rx="14" fill="white" stroke="#d9e1e9" stroke-width="2" /><text x="80" y="388" font-size="26" fill="#203249" font-weight="650" text-anchor="start">Retinal function</text><text x="660" y="388" font-size="26" fill="#203249" font-weight="650" text-anchor="start">Epithelial integrity</text><rect x="115" y="420" width="24" height="95" rx="10" fill="#e6e1f2" stroke="#8170b5" stroke-width="2" /><circle cx="127" cy="532" r="13" fill="#f3dce4" stroke="#9f4765" stroke-width="2" /><rect x="170" y="420" width="24" height="95" rx="10" fill="#e6e1f2" stroke="#8170b5" stroke-width="2" /><circle cx="182" cy="532" r="13" fill="#f3dce4" stroke="#9f4765" stroke-width="2" /><rect x="225" y="420" width="24" height="95" rx="10" fill="#e6e1f2" stroke="#8170b5" stroke-width="2" /><circle cx="237" cy="532" r="13" fill="#f3dce4" stroke="#9f4765" stroke-width="2" /><text x="290" y="447" font-size="21" fill="#6a7a8c" font-weight="400" text-anchor="start">Less rhodopsin support</text><text x="290" y="479" font-size="21" fill="#6a7a8c" font-weight="400" text-anchor="start">Impaired dim-light vision</text><text x="80" y="590" font-size="22" fill="#9f4765" font-weight="650" text-anchor="start">Night blindness can be an early sign</text><rect x="680" y="435" width="48" height="40" rx="2" fill="#f3dce4" stroke="#9f4765" stroke-width="2" /><rect x="732" y="435" width="48" height="40" rx="2" fill="#f3dce4" stroke="#9f4765" stroke-width="2" /><rect x="784" y="435" width="48" height="40" rx="2" fill="#f3dce4" stroke="#9f4765" stroke-width="2" /><rect x="836" y="435" width="48" height="40" rx="2" fill="#f3dce4" stroke="#9f4765" stroke-width="2" /><rect x="888" y="435" width="48" height="40" rx="2" fill="#f3dce4" stroke="#9f4765" stroke-width="2" /><rect x="940" y="435" width="48" height="40" rx="2" fill="#f3dce4" stroke="#9f4765" stroke-width="2" /><rect x="992" y="435" width="48" height="40" rx="2" fill="#f3dce4" stroke="#9f4765" stroke-width="2" /><rect x="1044" y="435" width="48" height="40" rx="2" fill="#f3dce4" stroke="#9f4765" stroke-width="2" /><rect x="680" y="477" width="48" height="26" rx="2" fill="#e6e1f2" stroke="#8170b5" stroke-width="2" /><rect x="732" y="477" width="48" height="26" rx="2" fill="#e6e1f2" stroke="#8170b5" stroke-width="2" /><rect x="784" y="477" width="48" height="26" rx="2" fill="#e6e1f2" stroke="#8170b5" stroke-width="2" /><rect x="836" y="477" width="48" height="26" rx="2" fill="#e6e1f2" stroke="#8170b5" stroke-width="2" /><rect x="888" y="477" width="48" height="26" rx="2" fill="#e6e1f2" stroke="#8170b5" stroke-width="2" /><rect x="940" y="477" width="48" height="26" rx="2" fill="#e6e1f2" stroke="#8170b5" stroke-width="2" /><rect x="992" y="477" width="48" height="26" rx="2" fill="#e6e1f2" stroke="#8170b5" stroke-width="2" /><rect x="1044" y="477" width="48" height="26" rx="2" fill="#e6e1f2" stroke="#8170b5" stroke-width="2" /><text x="665" y="544" font-size="21" fill="#6a7a8c" font-weight="400" text-anchor="start">Abnormal epithelial differentiation</text><text x="665" y="574" font-size="21" fill="#6a7a8c" font-weight="400" text-anchor="start">Conjunctival / corneal surface disease</text><text x="665" y="610" font-size="22" fill="#9f4765" font-weight="650" text-anchor="start">Severe deficiency can threaten sight</text><path d="M44 693 L1156 693" stroke="#d9e1e9" stroke-width="3" fill="none" /><text x="44" y="720" font-size="17" fill="#6a7a8c" font-weight="400" text-anchor="start">Xerophthalmia includes ocular surface disease; it is not simply another name for night blindness.</text><text x="44" y="746" font-size="14" fill="#6a7a8c" font-weight="400" text-anchor="start">Schematic • not a photomicrograph</text><text x="1156" y="746" font-size="14" fill="#6a7a8c" font-weight="400" text-anchor="end">Original Path Deck illustration · CC BY 4.0</text><text x="392" y="275" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">epithelial differentiation.</text></g></svg>