<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description"><title id="title">Cell injury: recover or progress</title><desc id="description">Flowchart of reversible injury, recovery and irreversible injury with necrosis; apoptosis is shown as a distinct regulated death programme.</desc><defs><marker id="slateArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#6a7a8c" /></marker><marker id="roseArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#9f4765" /></marker><marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#267b78" /></marker><marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#8170b5" /></marker></defs><rect width="1200" height="760" fill="#f5f7fa" /><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="44" fill="#267b78" font-size="15" font-weight="700" text-anchor="start">PATH DECK  /  MECHANISMS</text><text x="44" y="91" fill="#203249" font-size="34" font-weight="700" text-anchor="start">Cell injury: recover or progress</text><text x="44" y="125" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Severity, duration and cell type determine the outcome.</text><path d="M44 147H1156" fill="none" stroke="#d9e1e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="50" y="192" width="250" height="136" rx="16" fill="#ffffff" stroke="#d9e1e9" stroke-width="2" /><rect x="51" y="193" width="6" height="134" rx="3" fill="#267b78" stroke="#267b78" stroke-width="2" /><text x="73" y="229" fill="#203249" font-size="24" font-weight="650" text-anchor="start">Cellular stress</text><path d="M300,245 L365,245" fill="none" stroke="#6a7a8c" stroke-width="3" marker-end="url(#slateArrow)" /><rect x="385" y="185" width="340" height="136" rx="16" fill="#deefeb" stroke="#d9e1e9" stroke-width="2" /><rect x="386" y="186" width="6" height="134" rx="3" fill="#267b78" stroke="#267b78" stroke-width="2" /><text x="408" y="222" fill="#203249" font-size="24" font-weight="650" text-anchor="start">Reversible injury</text><text x="408" y="257" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">ATP falls; ion pumps fail.</text><text x="408" y="286" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Cell swelling and fatty</text><text x="408" y="315" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">change can occur.</text><path d="M725,246 L790,246" fill="none" stroke="#6a7a8c" stroke-width="3" marker-end="url(#slateArrow)" /><rect x="810" y="185" width="340" height="136" rx="16" fill="#deefeb" stroke="#d9e1e9" stroke-width="2" /><rect x="811" y="186" width="6" height="134" rx="3" fill="#267b78" stroke="#267b78" stroke-width="2" /><text x="833" y="222" fill="#203249" font-size="24" font-weight="650" text-anchor="start">Recovery</text><text x="833" y="257" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Remove the cause before</text><text x="833" y="286" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">critical damage develops.</text><path d="M555,321 L555,380" fill="none" stroke="#9f4765" stroke-width="3" marker-end="url(#roseArrow)" /><text x="580" y="360" fill="#9f4765" font-size="20" font-weight="650" text-anchor="start">Persistent or severe injury</text><rect x="365" y="398" width="380" height="150" rx="16" fill="#f3dce4" stroke="#d9e1e9" stroke-width="2" /><rect x="366" y="399" width="6" height="148" rx="3" fill="#9f4765" stroke="#9f4765" stroke-width="2" /><text x="388" y="435" fill="#203249" font-size="24" font-weight="650" text-anchor="start">Irreversible injury</text><text x="388" y="470" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Critical mitochondrial</text><text x="388" y="499" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">dysfunction and membrane</text><text x="388" y="528" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">damage</text><path d="M745,463 L800,463" fill="none" stroke="#9f4765" stroke-width="3" marker-end="url(#roseArrow)" /><rect x="820" y="398" width="330" height="150" rx="16" fill="#f3dce4" stroke="#d9e1e9" stroke-width="2" /><rect x="821" y="399" width="6" height="148" rx="3" fill="#9f4765" stroke="#9f4765" stroke-width="2" /><text x="843" y="435" fill="#203249" font-size="24" font-weight="650" text-anchor="start">Necrosis</text><text x="843" y="470" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Cell rupture and enzyme</text><text x="843" y="499" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">leakage trigger</text><text x="843" y="528" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">inflammation.</text><rect x="50" y="563" width="1100" height="92" rx="16" fill="#e7e1f3" stroke="#d9e1e9" stroke-width="2" /><rect x="51" y="564" width="6" height="90" rx="3" fill="#8170b5" stroke="#8170b5" stroke-width="2" /><text x="73" y="600" fill="#203249" font-size="24" font-weight="650" text-anchor="start">A different death programme</text><text x="73" y="635" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Apoptosis packages cell contents into membrane-bound fragments for removal.</text><path d="M44 693H1156" fill="none" stroke="#d9e1e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="44" y="720" fill="#6a7a8c" font-size="17" font-weight="400" text-anchor="start">Cell swelling alone does not establish irreversibility.</text><text x="44" y="746" fill="#6a7a8c" font-size="14" font-weight="400" text-anchor="start">Schematic • not a photomicrograph</text><text x="1156" y="746" fill="#6a7a8c" font-size="14" font-weight="400" text-anchor="end">Original Path Deck illustration · CC BY 4.0</text><text x="73" y="264" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Hypoxia, toxins,</text><text x="73" y="290" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">infection, physical</text><text x="73" y="316" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">injury</text></g></svg>