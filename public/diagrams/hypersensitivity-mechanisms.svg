<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description"><title id="title">Four mechanisms of hypersensitivity</title><desc id="description">Four distinct mechanisms show IgE-associated mast-cell activation, target-directed antibody effects, immune-complex deposition and T-cell-mediated injury.</desc><defs><marker id="slateArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#6a7a8c"/></marker><marker id="roseArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#9f4765"/></marker><marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#267b78"/></marker><marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#8170b5"/></marker></defs><rect width="1200" height="760" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="44" fill="#267b78" font-size="15" font-weight="700" text-anchor="start">PATH DECK  /  MECHANISMS</text><text x="44" y="91" fill="#203249" font-size="34" font-weight="700" text-anchor="start">Four mechanisms of hypersensitivity</text><text x="44" y="125" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Classify the immune mechanism, rather than relying on timing or one stain alone.</text><path d="M44 147H1156" fill="none" stroke="#d9e1e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="44" y="176" width="544" height="230" rx="16" fill="#ffffff" stroke="#d9e1e9" stroke-width="2"/><text x="66" y="213" fill="#203249" font-size="25" font-weight="650" text-anchor="start">I  IgE and mast cells</text><rect x="612" y="176" width="544" height="230" rx="16" fill="#ffffff" stroke="#d9e1e9" stroke-width="2"/><text x="634" y="213" fill="#203249" font-size="25" font-weight="650" text-anchor="start">II  Antibody at a target</text><rect x="44" y="423" width="544" height="230" rx="16" fill="#ffffff" stroke="#d9e1e9" stroke-width="2"/><text x="66" y="460" fill="#203249" font-size="25" font-weight="650" text-anchor="start">III  Immune complexes</text><rect x="612" y="423" width="544" height="230" rx="16" fill="#ffffff" stroke="#d9e1e9" stroke-width="2"/><text x="634" y="460" fill="#203249" font-size="25" font-weight="650" text-anchor="start">IV  T-cell mediated</text><circle cx="170" cy="275" r="35" fill="#e7e1f3" stroke="#9f4765" stroke-width="2"/><circle cx="170" cy="275" r="10.5" fill="#8170b5" stroke="#8170b5" stroke-width="2"/><path d="M170 242V224M170 224L158 210M170 224L182 210" fill="none" stroke="#8170b5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M126 273V255M126 255L114 241M126 255L138 241" fill="none" stroke="#8170b5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M215 273V255M215 255L203 241M215 255L227 241" fill="none" stroke="#8170b5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M216 287L310 287" fill="none" stroke="#9f4765" stroke-width="3" marker-end="url(#roseArrow)"/><circle cx="331" cy="274" r="6" fill="#9f4765" stroke="#9f4765" stroke-width="2"/><circle cx="353" cy="294" r="6" fill="#9f4765" stroke="#9f4765" stroke-width="2"/><circle cx="380" cy="277" r="6" fill="#9f4765" stroke="#9f4765" stroke-width="2"/><text x="416" y="286" fill="#9f4765" font-size="19" font-weight="650" text-anchor="start">Mediators</text><text x="66" y="343" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Sensitised mast cells release mediators when</text><text x="66" y="370" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">bound IgE is cross-linked by allergen.</text><circle cx="760" cy="277" r="36" fill="#f3dce4" stroke="#9f4765" stroke-width="2"/><circle cx="760" cy="277" r="10.799999999999999" fill="#8170b5" stroke="#8170b5" stroke-width="2"/><path d="M722 255V237M722 237L710 223M722 237L734 223" fill="none" stroke="#8170b5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M789 255V237M789 237L777 223M789 237L801 223" fill="none" stroke="#8170b5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M817 277L904 277" fill="none" stroke="#9f4765" stroke-width="3" marker-end="url(#roseArrow)"/><text x="920" y="272" fill="#9f4765" font-size="19" font-weight="650" text-anchor="start">Injury or</text><text x="920" y="298" fill="#9f4765" font-size="19" font-weight="650" text-anchor="start">dysfunction</text><text x="634" y="343" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">IgG or IgM targets cell or matrix antigens.</text><text x="634" y="370" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Effects include injury or altered receptor</text><text x="634" y="397" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">function.</text><path d="M140 533V515M140 515L128 501M140 515L152 501" fill="none" stroke="#8170b5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="147" cy="504" r="8" fill="#9f4765" stroke="#9f4765" stroke-width="2"/><path d="M200 533V515M200 515L188 501M200 515L212 501" fill="none" stroke="#8170b5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="207" cy="504" r="8" fill="#9f4765" stroke="#9f4765" stroke-width="2"/><path d="M260 533V515M260 515L248 501M260 515L272 501" fill="none" stroke="#8170b5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="267" cy="504" r="8" fill="#9f4765" stroke="#9f4765" stroke-width="2"/><path d="M300 523L385 523" fill="none" stroke="#9f4765" stroke-width="3" marker-end="url(#roseArrow)"/><path d="M400 492V548H535" fill="none" stroke="#9f4765" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="412" y="524" fill="#9f4765" font-size="18" font-weight="650" text-anchor="start">Vessel</text><text x="66" y="590" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Deposited immune complexes activate</text><text x="66" y="617" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">complement and recruit inflammatory cells.</text><circle cx="740" cy="522" r="32" fill="#e7e1f3" stroke="#9f4765" stroke-width="2"/><circle cx="740" cy="522" r="9.6" fill="#8170b5" stroke="#8170b5" stroke-width="2"/><text x="740" y="530" fill="#8170b5" font-size="22" font-weight="700" text-anchor="middle">T</text><path d="M782 522L880 522" fill="none" stroke="#267b78" stroke-width="3" marker-end="url(#tealArrow)"/><circle cx="928" cy="522" r="30" fill="#f3dce4" stroke="#9f4765" stroke-width="2"/><circle cx="928" cy="522" r="9.0" fill="#8170b5" stroke="#8170b5" stroke-width="2"/><text x="1010" y="513" fill="#9f4765" font-size="19" font-weight="650" text-anchor="start">Target</text><text x="1010" y="540" fill="#9f4765" font-size="19" font-weight="650" text-anchor="start">tissue</text><text x="634" y="590" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">T-cell signals recruit inflammation or</text><text x="634" y="617" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">trigger direct cell killing; antibodies are</text><text x="634" y="644" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">not the main driver.</text><path d="M44 693H1156" fill="none" stroke="#d9e1e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="720" fill="#6a7a8c" font-size="17" font-weight="400" text-anchor="start">A clinical disease may involve more than one immune mechanism.</text><text x="44" y="746" fill="#6a7a8c" font-size="14" font-weight="400" text-anchor="start">Schematic • not a photomicrograph</text><text x="1156" y="746" fill="#6a7a8c" font-size="14" font-weight="400" text-anchor="end">Original Path Deck illustration · CC BY 4.0</text></g></svg>