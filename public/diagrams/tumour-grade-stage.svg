<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description"><title id="title">Grade and stage answer different questions</title><desc id="description">Tumour grade is illustrated as differentiation under the microscope; stage is explained through primary tumour, regional lymph nodes and distant metastasis.</desc><defs><marker id="slateArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#6a7a8c"/></marker><marker id="roseArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#9f4765"/></marker><marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#267b78"/></marker><marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#8170b5"/></marker></defs><rect width="1200" height="760" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="44" fill="#267b78" font-size="15" font-weight="700" text-anchor="start">PATH DECK  /  MECHANISMS</text><text x="44" y="91" fill="#203249" font-size="34" font-weight="700" text-anchor="start">Grade and stage answer different questions</text><text x="44" y="125" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Microscopic appearance is not the same as anatomical extent.</text><path d="M44 147H1156" fill="none" stroke="#d9e1e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="55" y="180" width="520" height="115" rx="16" fill="#e7e1f3" stroke="#d9e1e9" stroke-width="2"/><rect x="56" y="181" width="6" height="113" rx="3" fill="#8170b5" stroke="#8170b5" stroke-width="2"/><text x="78" y="217" fill="#203249" font-size="24" font-weight="650" text-anchor="start">Grade: what the tumour looks like</text><text x="78" y="252" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Differentiation and other microscopic</text><text x="78" y="281" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">features</text><circle cx="175" cy="399" r="53" fill="#ffffff" stroke="#d9e1e9" stroke-width="2"/><circle cx="200.0" cy="399.0" r="12" fill="#f3dce4" stroke="#9f4765" stroke-width="2"/><circle cx="200.0" cy="399.0" r="4.08" fill="#8170b5" stroke="#8170b5" stroke-width="1"/><circle cx="182.72542485937367" cy="422.7764129073788" r="12" fill="#f3dce4" stroke="#9f4765" stroke-width="2"/><circle cx="182.72542485937367" cy="422.7764129073788" r="4.08" fill="#8170b5" stroke="#8170b5" stroke-width="1"/><circle cx="154.77457514062633" cy="413.69463130731185" r="12" fill="#f3dce4" stroke="#9f4765" stroke-width="2"/><circle cx="154.77457514062633" cy="413.69463130731185" r="4.08" fill="#8170b5" stroke="#8170b5" stroke-width="1"/><circle cx="154.77457514062633" cy="384.30536869268815" r="12" fill="#f3dce4" stroke="#9f4765" stroke-width="2"/><circle cx="154.77457514062633" cy="384.30536869268815" r="4.08" fill="#8170b5" stroke="#8170b5" stroke-width="1"/><circle cx="182.72542485937367" cy="375.2235870926212" r="12" fill="#f3dce4" stroke="#9f4765" stroke-width="2"/><circle cx="182.72542485937367" cy="375.2235870926212" r="4.08" fill="#8170b5" stroke="#8170b5" stroke-width="1"/><text x="175" y="495" fill="#203249" font-size="20" font-weight="650" text-anchor="middle">Better</text><circle cx="315" cy="399" r="53" fill="#ffffff" stroke="#d9e1e9" stroke-width="2"/><circle cx="340.0" cy="399.0" r="14" fill="#f3dce4" stroke="#9f4765" stroke-width="2"/><circle cx="340.0" cy="399.0" r="4.760000000000001" fill="#8170b5" stroke="#8170b5" stroke-width="1"/><circle cx="322.7254248593737" cy="422.7764129073788" r="14" fill="#f3dce4" stroke="#9f4765" stroke-width="2"/><circle cx="322.7254248593737" cy="422.7764129073788" r="4.760000000000001" fill="#8170b5" stroke="#8170b5" stroke-width="1"/><circle cx="294.7745751406263" cy="413.69463130731185" r="14" fill="#f3dce4" stroke="#9f4765" stroke-width="2"/><circle cx="294.7745751406263" cy="413.69463130731185" r="4.760000000000001" fill="#8170b5" stroke="#8170b5" stroke-width="1"/><circle cx="294.7745751406263" cy="384.30536869268815" r="14" fill="#f3dce4" stroke="#9f4765" stroke-width="2"/><circle cx="294.7745751406263" cy="384.30536869268815" r="4.760000000000001" fill="#8170b5" stroke="#8170b5" stroke-width="1"/><circle cx="322.7254248593737" cy="375.2235870926212" r="14" fill="#f3dce4" stroke="#9f4765" stroke-width="2"/><circle cx="322.7254248593737" cy="375.2235870926212" r="4.760000000000001" fill="#8170b5" stroke="#8170b5" stroke-width="1"/><text x="315" y="495" fill="#203249" font-size="20" font-weight="650" text-anchor="middle">Intermediate</text><circle cx="455" cy="399" r="53" fill="#ffffff" stroke="#d9e1e9" stroke-width="2"/><circle cx="480.0" cy="399.0" r="16" fill="#f3dce4" stroke="#9f4765" stroke-width="2"/><circle cx="480.0" cy="399.0" r="5.44" fill="#8170b5" stroke="#8170b5" stroke-width="1"/><circle cx="462.7254248593737" cy="422.7764129073788" r="16" fill="#f3dce4" stroke="#9f4765" stroke-width="2"/><circle cx="462.7254248593737" cy="422.7764129073788" r="5.44" fill="#8170b5" stroke="#8170b5" stroke-width="1"/><circle cx="434.7745751406263" cy="413.69463130731185" r="16" fill="#f3dce4" stroke="#9f4765" stroke-width="2"/><circle cx="434.7745751406263" cy="413.69463130731185" r="5.44" fill="#8170b5" stroke="#8170b5" stroke-width="1"/><circle cx="434.7745751406263" cy="384.30536869268815" r="16" fill="#f3dce4" stroke="#9f4765" stroke-width="2"/><circle cx="434.7745751406263" cy="384.30536869268815" r="5.44" fill="#8170b5" stroke="#8170b5" stroke-width="1"/><circle cx="462.7254248593737" cy="375.2235870926212" r="16" fill="#f3dce4" stroke="#9f4765" stroke-width="2"/><circle cx="462.7254248593737" cy="375.2235870926212" r="5.44" fill="#8170b5" stroke="#8170b5" stroke-width="1"/><text x="455" y="495" fill="#203249" font-size="20" font-weight="650" text-anchor="middle">Poorer</text><text x="315" y="529" fill="#6a7a8c" font-size="19" font-weight="400" text-anchor="middle">differentiation (illustrative only)</text><rect x="625" y="180" width="520" height="115" rx="16" fill="#deefeb" stroke="#d9e1e9" stroke-width="2"/><rect x="626" y="181" width="6" height="113" rx="3" fill="#267b78" stroke="#267b78" stroke-width="2"/><text x="648" y="217" fill="#203249" font-size="24" font-weight="650" text-anchor="start">Stage: where the tumour has reached</text><text x="648" y="252" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Anatomical extent, with cancer-specific</text><text x="648" y="281" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">rules</text><circle cx="685" cy="364" r="27" fill="#deefeb" stroke="#267b78" stroke-width="2"/><text x="685" y="372" fill="#267b78" font-size="25" font-weight="700" text-anchor="middle">T</text><text x="735" y="357" fill="#203249" font-size="23" font-weight="650" text-anchor="start">Primary tumour</text><text x="735" y="388" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Size and/or local extent</text><circle cx="685" cy="472" r="27" fill="#deefeb" stroke="#267b78" stroke-width="2"/><text x="685" y="480" fill="#267b78" font-size="25" font-weight="700" text-anchor="middle">N</text><text x="735" y="465" fill="#203249" font-size="23" font-weight="650" text-anchor="start">Regional nodes</text><text x="735" y="496" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Extent of nodal involvement</text><circle cx="685" cy="580" r="27" fill="#deefeb" stroke="#267b78" stroke-width="2"/><text x="685" y="588" fill="#267b78" font-size="25" font-weight="700" text-anchor="middle">M</text><text x="735" y="573" fill="#203249" font-size="23" font-weight="650" text-anchor="start">Distant metastasis</text><text x="735" y="604" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Presence of distant spread</text><path d="M44 693H1156" fill="none" stroke="#d9e1e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="720" fill="#6a7a8c" font-size="17" font-weight="400" text-anchor="start">Grading and staging systems vary by tumour type; TNM is not used for every cancer.</text><text x="44" y="746" fill="#6a7a8c" font-size="14" font-weight="400" text-anchor="start">Schematic • not a photomicrograph</text><text x="1156" y="746" fill="#6a7a8c" font-size="14" font-weight="400" text-anchor="end">Original Path Deck illustration · CC BY 4.0</text></g></svg>