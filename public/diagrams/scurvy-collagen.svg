<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description"><title id="title">Scurvy: vitamin C and connective tissue weakness</title><desc id="description">Vitamin C deficiency impairs collagen hydroxylation and connective tissue support, contributing to capillary fragility, gingival disease and impaired wound healing.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#6a7a8c" /></marker></defs><rect x="0" y="0" width="1200" height="760" rx="0" fill="#f5f7fa" stroke="#f5f7fa" stroke-width="2" /><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="44" font-size="15" fill="#267b78" font-weight="700" text-anchor="start">PATH DECK  /  MECHANISMS</text><text x="44" y="91" font-size="32" fill="#203249" font-weight="700" text-anchor="start">Scurvy: vitamin C and connective tissue weakness</text><text x="44" y="125" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">The schematic links a biochemical role to characteristic tissue effects.</text><path d="M44 147 L1156 147" stroke="#d9e1e9" stroke-width="3" fill="none" /><path d="M44 693 L1156 693" stroke="#d9e1e9" stroke-width="3" fill="none" /><text x="44" y="720" font-size="17" fill="#6a7a8c" font-weight="400" text-anchor="start">This highlights collagen biology; vitamin C has additional roles and scurvy is a clinical diagnosis.</text><text x="44" y="746" font-size="14" fill="#6a7a8c" font-weight="400" text-anchor="start">Schematic • not a photomicrograph</text><text x="1156" y="746" font-size="14" fill="#6a7a8c" font-weight="400" text-anchor="end">Original Path Deck illustration · CC BY 4.0</text><rect x="55" y="180" width="300" height="125" rx="14" fill="#f3dce4" stroke="#d9e1e9" stroke-width="2" /><text x="77" y="217" font-size="24" fill="#203249" font-weight="650" text-anchor="start">Vitamin C deficiency</text><text x="77" y="253" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">Less cofactor support for</text><text x="77" y="280" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">collagen hydroxylation.</text><path d="M355 241L420 241" stroke="#6a7a8c" stroke-width="3" fill="none" marker-end="url(#arr)" /><rect x="430" y="180" width="325" height="125" rx="14" fill="#e6e1f2" stroke="#d9e1e9" stroke-width="2" /><text x="452" y="217" font-size="24" fill="#203249" font-weight="650" text-anchor="start">Impaired hydroxylation</text><text x="452" y="253" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">Proline and lysine residues</text><text x="452" y="280" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">in newly made procollagen.</text><path d="M755 241L817 241" stroke="#6a7a8c" stroke-width="3" fill="none" marker-end="url(#arr)" /><rect x="827" y="180" width="318" height="125" rx="14" fill="#dff0ee" stroke="#d9e1e9" stroke-width="2" /><text x="849" y="217" font-size="24" fill="#203249" font-weight="650" text-anchor="start">Weaker tissue support</text><text x="849" y="253" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">Collagen maturation and</text><text x="849" y="280" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">stability are impaired.</text><path d="M145 370 Q195 348 245 370 T345 370 T445 370" fill="none" stroke="#8170b5" stroke-width="4" /><path d="M145 387 Q195 365 245 387 T345 387 T445 387" fill="none" stroke="#8170b5" stroke-width="4" /><path d="M145 404 Q195 382 245 404 T345 404 T445 404" fill="none" stroke="#8170b5" stroke-width="4" /><text x="295" y="449" font-size="21" fill="#6a7a8c" font-weight="400" text-anchor="middle">Collagen-rich connective tissue</text><path d="M980 305 L980 340 L540 340 L540 460" stroke="#6a7a8c" stroke-width="3" fill="none" marker-end="url(#arr)" /><path d="M540 460L240 500" stroke="#6a7a8c" stroke-width="3" fill="none" marker-end="url(#arr)" /><path d="M540 460L600 500" stroke="#6a7a8c" stroke-width="3" fill="none" marker-end="url(#arr)" /><path d="M540 460L960 500" stroke="#6a7a8c" stroke-width="3" fill="none" marker-end="url(#arr)" /><rect x="55" y="510" width="350" height="130" rx="14" fill="#fff" stroke="#d9e1e9" stroke-width="2" /><text x="77" y="547" font-size="24" fill="#203249" font-weight="650" text-anchor="start">Capillary fragility</text><text x="77" y="583" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">Petechiae and bruising;</text><text x="77" y="610" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">perifollicular hemorrhage.</text><rect x="425" y="510" width="350" height="130" rx="14" fill="#fff" stroke="#d9e1e9" stroke-width="2" /><text x="447" y="547" font-size="24" fill="#203249" font-weight="650" text-anchor="start">Gingival disease</text><text x="447" y="583" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">Swollen or bleeding gums</text><text x="447" y="610" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">and poor tissue support.</text><rect x="795" y="510" width="350" height="130" rx="14" fill="#fff" stroke="#d9e1e9" stroke-width="2" /><text x="817" y="547" font-size="24" fill="#203249" font-weight="650" text-anchor="start">Wound repair</text><text x="817" y="583" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">Impaired healing reflects</text><text x="817" y="610" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">weak connective tissue.</text></g></svg>