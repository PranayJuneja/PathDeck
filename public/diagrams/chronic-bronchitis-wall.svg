" text-anchor="start">Gland-layer thickness / wall from basement membrane to cartilage</text><path d="M44 693 L1156 693" stroke="#d9e1e9" stroke-width="3" fill="none"/><text x="44" y="720" font-size="17" fill="#6a7a8c" font-weight="400" text-anchor="start">Gland enlargement raises the index; the schematic is not drawn to a diagnostic measurement scale.</text><text x="44" y="746" font-size="14" fill="#6a7a8c" font-weight="400" text-anchor="start">Schematic • not a photomicrograph</text><text x="1156" y="746" font-size="14" fill="#6a7a8c" font-weight="400" text-anchor="end">Original Path Deck illustration · CC BY 4.0</text></g></svg>