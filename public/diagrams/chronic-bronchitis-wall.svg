<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description"><title id="title">Chronic bronchitis: mucus glands in the airway wall</title><desc id="description">A large cartilaginous bronchial wall shows excess luminal mucus and enlarged submucosal mucous glands. Reid index measurement boundaries are labeled.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#6a7a8c"/></marker></defs><rect x="0" y="0" width="1200" height="760" rx="0" fill="#f5f7fa" stroke="#f5f7fa" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="44" font-size="15" fill="#267b78" font-weight="700" text-anchor="start">PATH DECK  /  MECHANISMS</text><text x="44" y="91" font-size="32" fill="#203249" font-weight="700" text-anchor="start">Chronic bronchitis: mucus glands in the airway wall</text><text x="44" y="125" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">The Reid index is measured in cartilaginous bronchi, not gland-free bronchioles.</text><path d="M44 147 L1156 147" stroke="#d9e1e9" stroke-width="3" fill="none"/><text x="600" y="191" font-size="20" fill="#267b78" font-weight="700" text-anchor="middle">LARGE CARTILAGINOUS BRONCHUS — FLATTENED WALL SEGMENT</text><rect x="360" y="215" width="510" height="55" rx="14" fill="#dff0ee" stroke="#d9e1e9" stroke-width="2"/><text x="615" y="249" font-size="21" fill="#267b78" font-weight="400" text-anchor="middle">Lumen: excess mucus</text><rect x="370" y="276" width="32" height="35" rx="3" fill="#e6e1f2" stroke="#8170b5" stroke-width="2"/><rect x="405" y="276" width="32" height="35" rx="3" fill="#e6e1f2" stroke="#8170b5" stroke-width="2"/><rect x="440" y="276" width="32" height="35" rx="3" fill="#e6e1f2" stroke="#8170b5" stroke-width="2"/><rect x="475" y="276" width="32" height="35" rx="3" fill="#e6e1f2" stroke="#8170b5" stroke-width="2"/><rect x="510" y="27