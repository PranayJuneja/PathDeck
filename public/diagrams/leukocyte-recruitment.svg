<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description"><title id="title">Leukocytes leave the circulation</title><desc id="description">A venule cross-section illustrates rolling, firm adhesion, transendothelial migration and chemotaxis into tissue.</desc><defs><marker id="slateArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#6a7a8c" /></marker><marker id="roseArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#9f4765" /></marker><marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#267b78" /></marker><marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#8170b5" /></marker></defs><rect width="1200" height="760" fill="#f5f7fa" /><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="44" fill="#267b78" font-size="15" font-weight="700" text-anchor="start">PATH DECK  /  MECHANISMS</text><text x="44" y="91" fill="#203249" font-size="34" font-weight="700" text-anchor="start">Leukocytes leave the circulation</text><text x="44" y="125" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">From transient endothelial contact to movement toward an inflammatory focus.</text><path d="M44 147H1156" fill="none" stroke="#d9e1e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="55" y="185" width="1090" height="195" rx="35" fill="#ffffff" stroke="#d9e1e9" stroke-width="2" /><text x="78" y="214" fill="#6a7a8c" font-size="15" font-weight="700" text-anchor="start">POSTCAPILLARY VENULE</text><path d="M90,246 L1105,246" fill="none" stroke="#267b78" stroke-width="3" marker-end="url(#tealArrow)" /><path d="M75 360H1125" fill="none" stroke="#9f4765" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><circle cx="160" cy="321" r="29" fill="#e7e1f3" stroke="#9f4765" stroke-width="2" /><circle cx="160" cy="321" r="9.860000000000001" fill="#8170b5" stroke="#8170b5" stroke-width="1" /><circle cx="400" cy="328" r="29" fill="#e7e1f3" stroke="#9f4765" stroke-width="2" /><circle cx="400" cy="328" r="9.860000000000001" fill="#8170b5" stroke="#8170b5" stroke-width="1" /><circle cx="650" cy="329" r="29" fill="#e7e1f3" stroke="#9f4765" stroke-width="2" /><circle cx="650" cy="329" r="9.860000000000001" fill="#8170b5" stroke="#8170b5" stroke-width="1" /><circle cx="886" cy="400" r="29" fill="#e7e1f3" stroke="#9f4765" stroke-width="2" /><circle cx="886" cy="400" r="9.860000000000001" fill="#8170b5" stroke="#8170b5" stroke-width="1" /><path d="M675,330 L847,392" fill="none" stroke="#9f4765" stroke-width="3" marker-end="url(#roseArrow)" /><path d="M915,418 L1060,500" fill="none" stroke="#267b78" stroke-width="3" marker-end="url(#tealArrow)" /><rect x="60" y="465" width="240" height="165" rx="16" fill="#ffffff" stroke="#d9e1e9" stroke-width="2" /><rect x="61" y="466" width="6" height="163" rx="3" fill="#267b78" stroke="#267b78" stroke-width="2" /><text x="83" y="502" fill="#203249" font-size="24" font-weight="650" text-anchor="start">1  Rolling</text><text x="83" y="537" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Selectins form</text><text x="83" y="566" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">brief, weak</text><text x="83" y="595" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">contacts.</text><rect x="330" y="465" width="240" height="165" rx="16" fill="#ffffff" stroke="#d9e1e9" stroke-width="2" /><rect x="331" y="466" width="6" height="163" rx="3" fill="#267b78" stroke="#267b78" stroke-width="2" /><text x="353" y="502" fill="#203249" font-size="24" font-weight="650" text-anchor="start">2  Adhesion</text><text x="353" y="537" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Activated</text><text x="353" y="566" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">integrins bind</text><text x="353" y="595" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">endothelial</text><text x="353" y="624" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">ligands.</text><rect x="600" y="465" width="240" height="165" rx="16" fill="#ffffff" stroke="#d9e1e9" stroke-width="2" /><rect x="601" y="466" width="6" height="163" rx="3" fill="#267b78" stroke="#267b78" stroke-width="2" /><text x="623" y="502" fill="#203249" font-size="24" font-weight="650" text-anchor="start">3  Diapedesis</text><text x="623" y="537" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Leukocytes cross</text><text x="623" y="566" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">endothelial</text><text x="623" y="595" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">junctions.</text><rect x="870" y="465" width="270" height="165" rx="16" fill="#ffffff" stroke="#d9e1e9" stroke-width="2" /><rect x="871" y="466" width="6" height="163" rx="3" fill="#267b78" stroke="#267b78" stroke-width="2" /><text x="893" y="502" fill="#203249" font-size="24" font-weight="650" text-anchor="start">4  Chemotaxis</text><text x="893" y="537" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Cells follow chemical</text><text x="893" y="566" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">gradients into</text><text x="893" y="595" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">tissue.</text><text x="80" y="418" fill="#9f4765" font-size="19" font-weight="400" text-anchor="start">Endothelial lining</text><text x="550" y="418" fill="#6a7a8c" font-size="16" font-weight="700" text-anchor="start">INTERSTITIUM</text><path d="M44 693H1156" fill="none" stroke="#d9e1e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="44" y="720" fill="#6a7a8c" font-size="17" font-weight="400" text-anchor="start">Recruitment and tissue injury are dynamic processes; the stages overlap.</text><text x="44" y="746" fill="#6a7a8c" font-size="14" font-weight="400" text-anchor="start">Schematic • not a photomicrograph</text><text x="1156" y="746" fill="#6a7a8c" font-size="14" font-weight="400" text-anchor="end">Original Path Deck illustration · CC BY 4.0</text><path d="M150 349V360" stroke="#8170b5" stroke-width="2" fill="none" /><path d="M168 349V360" stroke="#8170b5" stroke-width="2" fill="none" /><path d="M390 356V360" stroke="#8170b5" stroke-width="2" fill="none" /><path d="M408 356V360" stroke="#8170b5" stroke-width="2" fill="none" /></g></svg>