<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description"><title id="title">Two useful peripheral-smear patterns</title><desc id="description">Stylised comparison of microcytic hypochromic red cells in iron deficiency and macro-ovalocytes with a hypersegmented neutrophil in megaloblastic anemia.</desc><defs><marker id="slateArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#6a7a8c"/></marker><marker id="roseArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#9f4765"/></marker><marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#267b78"/></marker><marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#8170b5"/></marker></defs><rect width="1200" height="760" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="44" fill="#267b78" font-size="15" font-weight="700" text-anchor="start">PATH DECK  /  MECHANISMS</text><text x="44" y="91" fill="#203249" font-size="34" font-weight="700" text-anchor="start">Two useful peripheral-smear patterns</text><text x="44" y="125" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Cell size, pallor and nuclear segmentation help organise the differential.</text><path d="M44 147H1156" fill="none" stroke="#d9e1e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="55" y="180" width="520" height="445" rx="16" fill="#ffffff" stroke="#d9e1e9" stroke-width="2"/><rect x="625" y="180" width="520" height="445" rx="16" fill="#ffffff" stroke="#d9e1e9" stroke-width="2"/><text x="315" y="222" fill="#203249" font-size="27" font-weight="650" text-anchor="middle">Iron-deficiency pattern</text><text x="885" y="222" fill="#203249" font-size="27" font-weight="650" text-anchor="middle">Megaloblastic pattern</text><circle cx="145" cy="318" r="24" fill="#f3dce4" stroke="#9f4765" stroke-width="2"/><circle cx="145" cy="318" r="16.799999999999997" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><circle cx="240" cy="351" r="22" fill="#f3dce4" stroke="#9f4765" stroke-width="2"/><circle cx="240" cy="351" r="15.399999999999999" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><circle cx="349" cy="300" r="25" fill="#f3dce4" stroke="#9f4765" stroke-width="2"/><circle cx="349" cy="300" r="17.5" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><circle cx="451" cy="361" r="23" fill="#f3dce4" stroke="#9f4765" stroke-width="2"/><circle cx="451" cy="361" r="16.099999999999998" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><circle cx="171" cy="422" r="21" fill="#f3dce4" stroke="#9f4765" stroke-width="2"/><circle cx="171" cy="422" r="14.7" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><circle cx="370" cy="416" r="23" fill="#f3dce4" stroke="#9f4765" stroke-width="2"/><circle cx="370" cy="416" r="16.099999999999998" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><ellipse cx="730" cy="316" rx="42" ry="30" fill="#f3dce4" stroke="#9f4765" stroke-width="2"/><ellipse cx="730" cy="316" rx="20" ry="13" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><ellipse cx="864" cy="340" rx="42" ry="30" fill="#f3dce4" stroke="#9f4765" stroke-width="2"/><ellipse cx="864" cy="340" rx="20" ry="13" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><ellipse cx="1017" cy="300" rx="42" ry="30" fill="#f3dce4" stroke="#9f4765" stroke-width="2"/><ellipse cx="1017" cy="300" rx="20" ry="13" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><ellipse cx="1000" cy="424" rx="42" ry="30" fill="#f3dce4" stroke="#9f4765" stroke-width="2"/><ellipse cx="1000" cy="424" rx="20" ry="13" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><ellipse cx="785" cy="435" rx="49" ry="35" fill="#e7e1f3" stroke="#8170b5" stroke-width="2"/><circle cx="755" cy="442" r="9" fill="#8170b5" stroke="#8170b5" stroke-width="1"/><circle cx="766" cy="428" r="9" fill="#8170b5" stroke="#8170b5" stroke-width="1"/><circle cx="777" cy="442" r="9" fill="#8170b5" stroke="#8170b5" stroke-width="1"/><circle cx="788" cy="428" r="9" fill="#8170b5" stroke="#8170b5" stroke-width="1"/><circle cx="799" cy="442" r="9" fill="#8170b5" stroke="#8170b5" stroke-width="1"/><circle cx="810" cy="428" r="9" fill="#8170b5" stroke="#8170b5" stroke-width="1"/><text x="90" y="506" fill="#203249" font-size="22" font-weight="400" text-anchor="start">Small, pale red cells</text><text x="90" y="537" fill="#203249" font-size="22" font-weight="400" text-anchor="start">Variation in size and shape</text><text x="90" y="568" fill="#203249" font-size="22" font-weight="400" text-anchor="start">Pencil forms can be present</text><text x="660" y="506" fill="#203249" font-size="22" font-weight="400" text-anchor="start">Macro-ovalocytes</text><text x="660" y="537" fill="#203249" font-size="22" font-weight="400" text-anchor="start">Hypersegmented neutrophils</text><text x="660" y="568" fill="#203249" font-size="22" font-weight="400" text-anchor="start">Often due to B12 or folate deficiency</text><path d="M44 693H1156" fill="none" stroke="#d9e1e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="720" fill="#6a7a8c" font-size="17" font-weight="400" text-anchor="start">These findings are suggestive, not exclusive. Confirm with indices and relevant laboratory tests.</text><text x="44" y="746" fill="#6a7a8c" font-size="14" font-weight="400" text-anchor="start">Schematic • not a photomicrograph</text><text x="1156" y="746" fill="#6a7a8c" font-size="14" font-weight="400" text-anchor="end">Original Path Deck illustration · CC BY 4.0</text></g></svg>