<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description"><title id="title">Reading three inheritance patterns</title><desc id="description">Illustrative Punnett squares compare autosomal dominant, autosomal recessive and X-linked recessive transmission.</desc><defs><marker id="slateArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#6a7a8c"/></marker><marker id="roseArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#9f4765"/></marker><marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#267b78"/></marker><marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#8170b5"/></marker></defs><rect width="1200" height="760" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="44" fill="#267b78" font-size="15" font-weight="700" text-anchor="start">PATH DECK  /  MECHANISMS</text><text x="44" y="91" fill="#203249" font-size="34" font-weight="700" text-anchor="start">Reading three inheritance patterns</text><text x="44" y="125" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Each square is one equally likely outcome for the specific parental genotypes shown.</text><path d="M44 147H1156" fill="none" stroke="#d9e1e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="44" y="176" width="360" height="480" rx="16" fill="#ffffff" stroke="#d9e1e9" stroke-width="2"/><text x="64" y="214" fill="#203249" font-size="24" font-weight="650" text-anchor="start">Autosomal dominant</text><text x="64" y="251" fill="#6a7a8c" font-size="19" font-weight="400" text-anchor="start">Aa × aa</text><text x="64" y="277" fill="#6a7a8c" font-size="19" font-weight="400" text-anchor="start">A = dominant disease variant</text><text x="194" y="315" fill="#6a7a8c" font-size="19" font-weight="650" text-anchor="middle">A</text><text x="294" y="315" fill="#6a7a8c" font-size="19" font-weight="650" text-anchor="middle">a</text><text x="109" y="386" fill="#6a7a8c" font-size="19" font-weight="650" text-anchor="middle">a</text><text x="109" y="466" fill="#6a7a8c" font-size="19" font-weight="650" text-anchor="middle">a</text><rect x="144" y="337" width="100" height="80" rx="4" fill="#f3dce4" stroke="#d9e1e9" stroke-width="2"/><text x="194" y="386" fill="#9f4765" font-size="18" font-weight="650" text-anchor="middle">Aa</text><rect x="244" y="337" width="100" height="80" rx="4" fill="#ffffff" stroke="#d9e1e9" stroke-width="2"/><text x="294" y="386" fill="#203249" font-size="18" font-weight="650" text-anchor="middle">aa</text><rect x="144" y="417" width="100" height="80" rx="4" fill="#f3dce4" stroke="#d9e1e9" stroke-width="2"/><text x="194" y="466" fill="#9f4765" font-size="18" font-weight="650" text-anchor="middle">Aa</text><rect x="244" y="417" width="100" height="80" rx="4" fill="#ffffff" stroke="#d9e1e9" stroke-width="2"/><text x="294" y="466" fill="#203249" font-size="18" font-weight="650" text-anchor="middle">aa</text><text x="64" y="552" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">1/2 inherit the variant in</text><text x="64" y="580" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">this illustrative cross.</text><rect x="420" y="176" width="360" height="480" rx="16" fill="#ffffff" stroke="#d9e1e9" stroke-width="2"/><text x="440" y="214" fill="#203249" font-size="24" font-weight="650" text-anchor="start">Autosomal recessive</text><text x="440" y="251" fill="#6a7a8c" font-size="19" font-weight="400" text-anchor="start">Aa × Aa</text><text x="440" y="277" fill="#6a7a8c" font-size="19" font-weight="400" text-anchor="start">a = recessive disease variant</text><text x="570" y="315" fill="#6a7a8c" font-size="19" font-weight="650" text-anchor="middle">A</text><text x="670" y="315" fill="#6a7a8c" font-size="19" font-weight="650" text-anchor="middle">a</text><text x="485" y="386" fill="#6a7a8c" font-size="19" font-weight="650" text-anchor="middle">A</text><text x="485" y="466" fill="#6a7a8c" font-size="19" font-weight="650" text-anchor="middle">a</text><rect x="520" y="337" width="100" height="80" rx="4" fill="#ffffff" stroke="#d9e1e9" stroke-width="2"/><text x="570" y="386" fill="#203249" font-size="18" font-weight="650" text-anchor="middle">AA</text><rect x="620" y="337" width="100" height="80" rx="4" fill="#ffffff" stroke="#d9e1e9" stroke-width="2"/><text x="670" y="386" fill="#203249" font-size="18" font-weight="650" text-anchor="middle">Aa</text><rect x="520" y="417" width="100" height="80" rx="4" fill="#ffffff" stroke="#d9e1e9" stroke-width="2"/><text x="570" y="466" fill="#203249" font-size="18" font-weight="650" text-anchor="middle">Aa</text><rect x="620" y="417" width="100" height="80" rx="4" fill="#f3dce4" stroke="#d9e1e9" stroke-width="2"/><text x="670" y="466" fill="#9f4765" font-size="18" font-weight="650" text-anchor="middle">aa</text><text x="440" y="552" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">1/4 affected (aa); 1/2</text><text x="440" y="580" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">carriers (Aa) in this cross.</text><rect x="796" y="176" width="360" height="480" rx="16" fill="#ffffff" stroke="#d9e1e9" stroke-width="2"/><text x="816" y="214" fill="#203249" font-size="24" font-weight="650" text-anchor="start">X-linked recessive</text><text x="816" y="251" fill="#6a7a8c" font-size="19" font-weight="400" text-anchor="start">Carrier mother × unaffected</text><text x="816" y="277" fill="#6a7a8c" font-size="19" font-weight="400" text-anchor="start">father</text><text x="816" y="303" fill="#6a7a8c" font-size="19" font-weight="400" text-anchor="start">a = disease variant</text><text x="946" y="315" fill="#6a7a8c" font-size="19" font-weight="650" text-anchor="middle">X(A)</text><text x="1046" y="315" fill="#6a7a8c" font-size="19" font-weight="650" text-anchor="middle">X(a)</text><text x="861" y="386" fill="#6a7a8c" font-size="19" font-weight="650" text-anchor="middle">X(A)</text><text x="861" y="466" fill="#6a7a8c" font-size="19" font-weight="650" text-anchor="middle">Y</text><rect x="896" y="337" width="100" height="80" rx="4" fill="#ffffff" stroke="#d9e1e9" stroke-width="2"/><text x="946" y="386" fill="#203249" font-size="18" font-weight="650" text-anchor="middle">X(A)X(A)</text><rect x="996" y="337" width="100" height="80" rx="4" fill="#ffffff" stroke="#d9e1e9" stroke-width="2"/><text x="1046" y="386" fill="#203249" font-size="18" font-weight="650" text-anchor="middle">X(A)X(a)</text><rect x="896" y="417" width="100" height="80" rx="4" fill="#ffffff" stroke="#d9e1e9" stroke-width="2"/><text x="946" y="466" fill="#203249" font-size="18" font-weight="650" text-anchor="middle">X(A)Y</text><rect x="996" y="417" width="100" height="80" rx="4" fill="#f3dce4" stroke="#d9e1e9" stroke-width="2"/><text x="1046" y="466" fill="#9f4765" font-size="18" font-weight="650" text-anchor="middle">X(a)Y</text><text x="816" y="552" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">1/2 of sons inherit the</text><text x="816" y="580" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">affected X; 1/2 of daughters</text><text x="816" y="608" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">are carriers.</text><path d="M44 693H1156" fill="none" stroke="#d9e1e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="720" fill="#6a7a8c" font-size="17" font-weight="400" text-anchor="start">Clinical expression can vary with penetrance and X-inactivation; these are simplified crosses.</text><text x="44" y="746" fill="#6a7a8c" font-size="14" font-weight="400" text-anchor="start">Schematic • not a photomicrograph</text><text x="1156" y="746" fill="#6a7a8c" font-size="14" font-weight="400" text-anchor="end">Original Path Deck illustration · CC BY 4.0</text></g></svg>