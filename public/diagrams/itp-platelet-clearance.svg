<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description"><title id="title">Immune thrombocytopenia: loss of circulating platelets</title><desc id="description">An illustrative ITP mechanism shows antibody-coated platelets cleared by splenic macrophages and impaired megakaryocyte production contributing to low platelet counts.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#6a7a8c" /></marker></defs><rect x="0" y="0" width="1200" height="760" rx="0" fill="#f5f7fa" stroke="#f5f7fa" stroke-width="2" /><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="44" font-size="15" fill="#267b78" font-weight="700" text-anchor="start">PATH DECK  /  MECHANISMS</text><text x="44" y="91" font-size="32" fill="#203249" font-weight="700" text-anchor="start">Immune thrombocytopenia: loss of circulating platelets</text><text x="44" y="125" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">Accelerated immune clearance and inadequate production can both contribute.</text><path d="M44 147 L1156 147" stroke="#d9e1e9" stroke-width="3" fill="none" /><path d="M44 693 L1156 693" stroke="#d9e1e9" stroke-width="3" fill="none" /><text x="44" y="720" font-size="17" fill="#6a7a8c" font-weight="400" text-anchor="start">An illustrative antibody pathway: T-cell and other clearance mechanisms also participate in ITP.</text><text x="44" y="746" font-size="14" fill="#6a7a8c" font-weight="400" text-anchor="start">Schematic • not a photomicrograph</text><text x="1156" y="746" font-size="14" fill="#6a7a8c" font-weight="400" text-anchor="end">Original Path Deck illustration · CC BY 4.0</text><rect x="55" y="180" width="330" height="120" rx="14" fill="#f3dce4" stroke="#d9e1e9" stroke-width="2" /><text x="77" y="217" font-size="24" fill="#203249" font-weight="650" text-anchor="start">Immune targeting</text><text x="77" y="253" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">Autoantibodies can bind</text><text x="77" y="280" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">platelet surface proteins.</text><circle cx="125" cy="365" r="20" fill="#e6e1f2" stroke="#8170b5" stroke-width="2" /><circle cx="125" cy="365" r="5" fill="#8170b5" stroke="#8170b5" stroke-width="2" /><path d="M125 345L125 323" stroke="#9f4765" stroke-width="3" fill="none" /><path d="M125 323L113 312" stroke="#9f4765" stroke-width="3" fill="none" /><path d="M125 323L137 312" stroke="#9f4765" stroke-width="3" fill="none" /><circle cx="225" cy="385" r="20" fill="#e6e1f2" stroke="#8170b5" stroke-width="2" /><circle cx="225" cy="385" r="5" fill="#8170b5" stroke="#8170b5" stroke-width="2" /><path d="M225 365L225 343" stroke="#9f4765" stroke-width="3" fill="none" /><path d="M225 343L213 332" stroke="#9f4765" stroke-width="3" fill="none" /><path d="M225 343L237 332" stroke="#9f4765" stroke-width="3" fill="none" /><circle cx="315" cy="350" r="20" fill="#e6e1f2" stroke="#8170b5" stroke-width="2" /><circle cx="315" cy="350" r="5" fill="#8170b5" stroke="#8170b5" stroke-width="2" /><path d="M315 330L315 308" stroke="#9f4765" stroke-width="3" fill="none" /><path d="M315 308L303 297" stroke="#9f4765" stroke-width="3" fill="none" /><path d="M315 308L327 297" stroke="#9f4765" stroke-width="3" fill="none" /><text x="220" y="450" font-size="21" fill="#6a7a8c" font-weight="400" text-anchor="middle">Antibody-coated platelets</text><path d="M385 240L450 240" stroke="#6a7a8c" stroke-width="3" fill="none" marker-end="url(#arr)" /><rect x="460" y="180" width="355" height="120" rx="14" fill="#dff0ee" stroke="#d9e1e9" stroke-width="2" /><text x="482" y="217" font-size="24" fill="#203249" font-weight="650" text-anchor="start">Splenic macrophage uptake</text><text x="482" y="253" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">Fc-receptor recognition can</text><text x="482" y="280" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">accelerate platelet removal.</text><circle cx="635" cy="382" r="60" fill="#dff0ee" stroke="#267b78" stroke-width="2" /><circle cx="620" cy="380" r="20" fill="#e6e1f2" stroke="#8170b5" stroke-width="2" /><path d="M365 380L560 380" stroke="#6a7a8c" stroke-width="3" fill="none" marker-end="url(#arr)" /><text x="635" y="475" font-size="21" fill="#267b78" font-weight="650" text-anchor="middle">Splenic clearance</text><rect x="855" y="180" width="290" height="185" rx="14" fill="#e6e1f2" stroke="#d9e1e9" stroke-width="2" /><text x="877" y="217" font-size="24" fill="#203249" font-weight="650" text-anchor="start">Reduced production</text><text x="877" y="253" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">Immune injury can affect</text><text x="877" y="280" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">megakaryocytes and</text><text x="877" y="307" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">platelet release from</text><text x="877" y="334" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">the bone marrow.</text><path d="M1000 365L1000 505" stroke="#6a7a8c" stroke-width="3" fill="none" marker-end="url(#arr)" /><path d="M635 485L635 505" stroke="#6a7a8c" stroke-width="3" fill="none" marker-end="url(#arr)" /><rect x="330" y="515" width="815" height="92" rx="14" fill="#fff" stroke="#d9e1e9" stroke-width="2" /><text x="352" y="552" font-size="24" fill="#203249" font-weight="650" text-anchor="start">Low platelet count</text><text x="352" y="588" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">Typically isolated thrombocytopenia; petechiae or mucosal bleeding may occur.</text><text x="600" y="660" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="middle">Distinguish ITP from thrombotic microangiopathy and from von Willebrand factor dysfunction.</text></g></svg>