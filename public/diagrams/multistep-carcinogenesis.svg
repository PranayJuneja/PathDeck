<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description"><title id="title">Cancer evolves through accumulated changes</title><desc id="description">Accumulated genetic or regulatory alterations change growth control, permit clonal expansion and generate tumour heterogeneity; an epithelial example shows later invasive growth.</desc><defs><marker id="slateArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#6a7a8c"/></marker><marker id="roseArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#9f4765"/></marker><marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#267b78"/></marker><marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#8170b5"/></marker></defs><rect width="1200" height="760" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="44" fill="#267b78" font-size="15" font-weight="700" text-anchor="start">PATH DECK  /  MECHANISMS</text><text x="44" y="91" fill="#203249" font-size="34" font-weight="700" text-anchor="start">Cancer evolves through accumulated changes</text><text x="44" y="125" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">An illustrative solid-tumour pathway: alteration, clonal growth, diversity and invasion.</text><path d="M44 147H1156" fill="none" stroke="#d9e1e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="45" y="180" width="340" height="115" rx="16" fill="#deefeb" stroke="#d9e1e9" stroke-width="2"/><rect x="46" y="181" width="6" height="113" rx="3" fill="#267b78" stroke="#267b78" stroke-width="2"/><text x="67" y="216" fill="#203249" font-size="24" font-weight="650" text-anchor="start">Altered growth signals</text><text x="67" y="250" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">More proliferative drive</text><rect x="430" y="180" width="340" height="115" rx="16" fill="#e7e1f3" stroke="#d9e1e9" stroke-width="2"/><rect x="431" y="181" width="6" height="113" rx="3" fill="#8170b5" stroke="#8170b5" stroke-width="2"/><text x="452" y="216" fill="#203249" font-size="24" font-weight="650" text-anchor="start">Weaker growth restraints</text><text x="452" y="250" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Loss of protective</text><text x="452" y="277" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">controls</text><rect x="815" y="180" width="340" height="115" rx="16" fill="#f3dce4" stroke="#d9e1e9" stroke-width="2"/><rect x="816" y="181" width="6" height="113" rx="3" fill="#9f4765" stroke="#9f4765" stroke-width="2"/><text x="837" y="216" fill="#203249" font-size="24" font-weight="650" text-anchor="start">Additional alterations</text><text x="837" y="250" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Changes accumulate over</text><text x="837" y="277" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">time</text><path d="M215 295L400 360" fill="none" stroke="#267b78" stroke-width="3" marker-end="url(#tealArrow)"/><path d="M600 295L600 360" fill="none" stroke="#8170b5" stroke-width="3" marker-end="url(#purpleArrow)"/><path d="M985 295L800 360" fill="none" stroke="#9f4765" stroke-width="3" marker-end="url(#roseArrow)"/><circle cx="125" cy="427" r="32" fill="#f3dce4" stroke="#9f4765" stroke-width="2"/><circle cx="125" cy="427" r="9.6" fill="#8170b5" stroke="#8170b5" stroke-width="2"/><text x="125" y="506" fill="#203249" font-size="22" font-weight="650" text-anchor="middle">Normal cell</text><path d="M175 427L310 427" fill="none" stroke="#6a7a8c" stroke-width="3" marker-end="url(#slateArrow)"/><circle cx="365" cy="408" r="25" fill="#e7e1f3" stroke="#9f4765" stroke-width="2"/><circle cx="365" cy="408" r="7.5" fill="#8170b5" stroke="#8170b5" stroke-width="2"/><circle cx="405" cy="429" r="25" fill="#e7e1f3" stroke="#9f4765" stroke-width="2"/><circle cx="405" cy="429" r="7.5" fill="#8170b5" stroke="#8170b5" stroke-width="2"/><circle cx="365" cy="452" r="25" fill="#e7e1f3" stroke="#9f4765" stroke-width="2"/><circle cx="365" cy="452" r="7.5" fill="#8170b5" stroke="#8170b5" stroke-width="2"/><text x="385" y="506" fill="#203249" font-size="22" font-weight="650" text-anchor="middle">Expanding clone</text><path d="M442 427L575 427" fill="none" stroke="#6a7a8c" stroke-width="3" marker-end="url(#slateArrow)"/><circle cx="630" cy="404" r="24" fill="#e7e1f3" stroke="#9f4765" stroke-width="2"/><circle cx="630" cy="404" r="7.199999999999999" fill="#8170b5" stroke="#8170b5" stroke-width="2"/><circle cx="673" cy="420" r="24" fill="#f3dce4" stroke="#9f4765" stroke-width="2"/><circle cx="673" cy="420" r="7.199999999999999" fill="#8170b5" stroke="#8170b5" stroke-width="2"/><circle cx="632" cy="448" r="24" fill="#deefeb" stroke="#9f4765" stroke-width="2"/><circle cx="632" cy="448" r="7.199999999999999" fill="#8170b5" stroke="#8170b5" stroke-width="2"/><circle cx="680" cy="465" r="24" fill="#e7e1f3" stroke="#9f4765" stroke-width="2"/><circle cx="680" cy="465" r="7.199999999999999" fill="#8170b5" stroke="#8170b5" stroke-width="2"/><circle cx="715" cy="438" r="24" fill="#f3dce4" stroke="#9f4765" stroke-width="2"/><circle cx="715" cy="438" r="7.199999999999999" fill="#8170b5" stroke="#8170b5" stroke-width="2"/><text x="670" y="506" fill="#203249" font-size="22" font-weight="650" text-anchor="middle">Diverse subclones</text><path d="M755 427L875 427" fill="none" stroke="#6a7a8c" stroke-width="3" marker-end="url(#slateArrow)"/><path d="M887 397H1140" fill="none" stroke="#267b78" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="940" cy="380" r="25" fill="#e7e1f3" stroke="#9f4765" stroke-width="2"/><circle cx="940" cy="380" r="7.5" fill="#8170b5" stroke="#8170b5" stroke-width="2"/><circle cx="985" cy="380" r="25" fill="#e7e1f3" stroke="#9f4765" stroke-width="2"/><circle cx="985" cy="380" r="7.5" fill="#8170b5" stroke="#8170b5" stroke-width="2"/><circle cx="1030" cy="380" r="25" fill="#e7e1f3" stroke="#9f4765" stroke-width="2"/><circle cx="1030" cy="380" r="7.5" fill="#8170b5" stroke="#8170b5" stroke-width="2"/><circle cx="1060" cy="426" r="25" fill="#e7e1f3" stroke="#9f4765" stroke-width="2"/><circle cx="1060" cy="426" r="7.5" fill="#8170b5" stroke="#8170b5" stroke-width="2"/><circle cx="1100" cy="461" r="25" fill="#e7e1f3" stroke="#9f4765" stroke-width="2"/><circle cx="1100" cy="461" r="7.5" fill="#8170b5" stroke="#8170b5" stroke-width="2"/><text x="1010" y="506" fill="#203249" font-size="22" font-weight="650" text-anchor="middle">Invasive growth</text><rect x="140" y="564" width="920" height="92" rx="16" fill="#ffffff" stroke="#d9e1e9" stroke-width="2"/><rect x="141" y="565" width="6" height="90" rx="3" fill="#8170b5" stroke="#8170b5" stroke-width="2"/><text x="162" y="600" fill="#203249" font-size="24" font-weight="650" text-anchor="start">Selection changes the tumour population</text><text x="162" y="634" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Subclones with useful growth or survival advantages can expand.</text><path d="M44 693H1156" fill="none" stroke="#d9e1e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="720" fill="#6a7a8c" font-size="17" font-weight="400" text-anchor="start">Routes, drivers and sequence vary. A predisposition or an altered clone does not guarantee cancer.</text><text x="44" y="746" fill="#6a7a8c" font-size="14" font-weight="400" text-anchor="start">Schematic • not a photomicrograph</text><text x="1156" y="746" fill="#6a7a8c" font-size="14" font-weight="400" text-anchor="end">Original Path Deck illustration · CC BY 4.0</text></g></svg>