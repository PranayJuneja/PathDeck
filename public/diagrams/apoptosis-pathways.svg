<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description"><title id="title">Two routes into apoptosis</title><desc id="description">Intrinsic mitochondrial and extrinsic death-receptor pathways converge on executioner caspases; apoptotic bodies are removed by phagocytes.</desc><defs><marker id="slateArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#6a7a8c"/></marker><marker id="roseArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#9f4765"/></marker><marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#267b78"/></marker><marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#8170b5"/></marker></defs><rect width="1200" height="760" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="44" fill="#267b78" font-size="15" font-weight="700" text-anchor="start">PATH DECK  /  MECHANISMS</text><text x="44" y="91" fill="#203249" font-size="34" font-weight="700" text-anchor="start">Two routes into apoptosis</text><text x="44" y="125" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Distinct initiating signals converge on a controlled cell-death programme.</text><path d="M44 147H1156" fill="none" stroke="#d9e1e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="180" width="475" height="112" rx="16" fill="#e7e1f3" stroke="#d9e1e9" stroke-width="2"/><rect x="61" y="181" width="6" height="110" rx="3" fill="#8170b5" stroke="#8170b5" stroke-width="2"/><text x="83" y="217" fill="#203249" font-size="24" font-weight="650" text-anchor="start">Intrinsic pathway</text><text x="83" y="252" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">DNA damage or loss of survival</text><text x="83" y="281" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">signals</text><rect x="665" y="180" width="475" height="112" rx="16" fill="#f3dce4" stroke="#d9e1e9" stroke-width="2"/><rect x="666" y="181" width="6" height="110" rx="3" fill="#9f4765" stroke="#9f4765" stroke-width="2"/><text x="688" y="217" fill="#203249" font-size="24" font-weight="650" text-anchor="start">Extrinsic pathway</text><text x="688" y="252" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Death-receptor signalling, such as</text><text x="688" y="281" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Fas</text><path d="M296,292 L296,340" fill="none" stroke="#8170b5" stroke-width="3" marker-end="url(#purpleArrow)"/><path d="M902,292 L902,340" fill="none" stroke="#9f4765" stroke-width="3" marker-end="url(#roseArrow)"/><rect x="60" y="355" width="475" height="105" rx="16" fill="#e7e1f3" stroke="#d9e1e9" stroke-width="2"/><rect x="61" y="356" width="6" height="103" rx="3" fill="#8170b5" stroke="#8170b5" stroke-width="2"/><text x="83" y="392" fill="#203249" font-size="24" font-weight="650" text-anchor="start">Mitochondrial signalling</text><text x="83" y="427" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Cytochrome c release → initiator</text><text x="83" y="456" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">caspase-9</text><rect x="665" y="355" width="475" height="105" rx="16" fill="#f3dce4" stroke="#d9e1e9" stroke-width="2"/><rect x="666" y="356" width="6" height="103" rx="3" fill="#9f4765" stroke="#9f4765" stroke-width="2"/><text x="688" y="392" fill="#203249" font-size="24" font-weight="650" text-anchor="start">Receptor-linked signalling</text><text x="688" y="427" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Initiator caspase-8 activation</text><path d="M296,460 L520,515" fill="none" stroke="#8170b5" stroke-width="3" marker-end="url(#purpleArrow)"/><path d="M902,460 L680,515" fill="none" stroke="#9f4765" stroke-width="3" marker-end="url(#roseArrow)"/><rect x="355" y="525" width="490" height="110" rx="16" fill="#deefeb" stroke="#d9e1e9" stroke-width="2"/><rect x="356" y="526" width="6" height="108" rx="3" fill="#267b78" stroke="#267b78" stroke-width="2"/><text x="378" y="562" fill="#203249" font-size="24" font-weight="650" text-anchor="start">Executioner caspases</text><text x="378" y="597" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Cell shrinkage, chromatin condensation</text><text x="378" y="626" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">and membrane-bound apoptotic bodies</text><path d="M44 693H1156" fill="none" stroke="#d9e1e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="720" fill="#6a7a8c" font-size="17" font-weight="400" text-anchor="start">Apoptotic bodies are usually cleared without the membrane rupture characteristic of necrosis.</text><text x="44" y="746" fill="#6a7a8c" font-size="14" font-weight="400" text-anchor="start">Schematic • not a photomicrograph</text><text x="1156" y="746" fill="#6a7a8c" font-size="14" font-weight="400" text-anchor="end">Original Path Deck illustration · CC BY 4.0</text></g></svg>