<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description"><title id="title">Familial hypercholesterolemia: LDL clearance</title><desc id="description">LDL binding, hepatocyte receptor uptake and receptor recycling are shown above three gene-specific disturbances: LDLR loss of function, FH-associated APOB binding defects and PCSK9 gain of function.</desc><defs><marker id="slateArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#6a7a8c"/></marker><marker id="roseArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#9f4765"/></marker><marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#267b78"/></marker><marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#8170b5"/></marker></defs><rect width="1200" height="760" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="44" fill="#267b78" font-size="15" font-weight="700" text-anchor="start">PATH DECK  /  MECHANISMS</text><text x="44" y="91" fill="#203249" font-size="34" font-weight="700" text-anchor="start">Familial hypercholesterolemia: LDL clearance</text><text x="44" y="125" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Different genetic defects can reduce removal of LDL from the bloodstream.</text><path d="M44 147H1156" fill="none" stroke="#d9e1e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="45" y="179" width="300" height="123" rx="16" fill="#ffffff" stroke="#d9e1e9" stroke-width="2"/><rect x="46" y="180" width="6" height="121" rx="3" fill="#267b78" stroke="#267b78" stroke-width="2"/><text x="67" y="215" fill="#203249" font-size="24" font-weight="650" text-anchor="start">LDL in the circulation</text><text x="67" y="249" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">ApoB-100 enables</text><text x="67" y="276" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">receptor binding.</text><path d="M345 240L422 240" fill="none" stroke="#267b78" stroke-width="3" marker-end="url(#tealArrow)"/><rect x="450" y="179" width="300" height="123" rx="16" fill="#deefeb" stroke="#d9e1e9" stroke-width="2"/><rect x="451" y="180" width="6" height="121" rx="3" fill="#267b78" stroke="#267b78" stroke-width="2"/><text x="472" y="215" fill="#203249" font-size="24" font-weight="650" text-anchor="start">Hepatocyte LDL receptor</text><text x="472" y="249" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Binds LDL and mediates</text><text x="472" y="276" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">uptake.</text><path d="M750 240L827 240" fill="none" stroke="#267b78" stroke-width="3" marker-end="url(#tealArrow)"/><rect x="855" y="179" width="300" height="123" rx="16" fill="#deefeb" stroke="#d9e1e9" stroke-width="2"/><rect x="856" y="180" width="6" height="121" rx="3" fill="#267b78" stroke="#267b78" stroke-width="2"/><text x="877" y="215" fill="#203249" font-size="24" font-weight="650" text-anchor="start">Clearance and recycling</text><text x="877" y="249" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">LDL is processed;</text><text x="877" y="276" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">receptors return to the</text><text x="877" y="303" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">surface.</text><rect x="45" y="359" width="340" height="172" rx="16" fill="#f3dce4" stroke="#d9e1e9" stroke-width="2"/><rect x="46" y="360" width="6" height="170" rx="3" fill="#9f4765" stroke="#9f4765" stroke-width="2"/><text x="67" y="395" fill="#203249" font-size="24" font-weight="650" text-anchor="start">LDLR loss of function</text><text x="67" y="429" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Fewer functional</text><text x="67" y="456" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">receptors or impaired LDL</text><text x="67" y="483" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">uptake.</text><rect x="430" y="359" width="340" height="172" rx="16" fill="#e7e1f3" stroke="#d9e1e9" stroke-width="2"/><rect x="431" y="360" width="6" height="170" rx="3" fill="#8170b5" stroke="#8170b5" stroke-width="2"/><text x="452" y="395" fill="#203249" font-size="24" font-weight="650" text-anchor="start">APOB: FH-linked variants</text><text x="452" y="429" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Altered ApoB-100 impairs</text><text x="452" y="456" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">LDL binding to its</text><text x="452" y="483" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">receptor.</text><rect x="815" y="359" width="340" height="172" rx="16" fill="#f3dce4" stroke="#d9e1e9" stroke-width="2"/><rect x="816" y="360" width="6" height="170" rx="3" fill="#9f4765" stroke="#9f4765" stroke-width="2"/><text x="837" y="395" fill="#203249" font-size="24" font-weight="650" text-anchor="start">PCSK9 gain of function</text><text x="837" y="429" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Faster receptor</text><text x="837" y="456" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">degradation leaves fewer</text><text x="837" y="483" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">surface receptors.</text><path d="M215 531L540 577" fill="none" stroke="#9f4765" stroke-width="3" marker-end="url(#roseArrow)"/><path d="M600 531L600 577" fill="none" stroke="#8170b5" stroke-width="3" marker-end="url(#purpleArrow)"/><path d="M985 531L660 577" fill="none" stroke="#9f4765" stroke-width="3" marker-end="url(#roseArrow)"/><rect x="150" y="590" width="900" height="73" rx="16" fill="#ffffff" stroke="#d9e1e9" stroke-width="2"/><rect x="151" y="591" width="6" height="71" rx="3" fill="#9f4765" stroke="#9f4765" stroke-width="2"/><text x="172" y="626" fill="#203249" font-size="24" font-weight="650" text-anchor="start">Reduced LDL clearance → high plasma LDL → early atherosclerosis</text><path d="M44 693H1156" fill="none" stroke="#d9e1e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="720" fill="#6a7a8c" font-size="17" font-weight="400" text-anchor="start">PCSK9 loss-of-function usually lowers LDL; it is not the FH mechanism shown here.</text><text x="44" y="746" fill="#6a7a8c" font-size="14" font-weight="400" text-anchor="start">Schematic • not a photomicrograph</text><text x="1156" y="746" fill="#6a7a8c" font-size="14" font-weight="400" text-anchor="end">Original Path Deck illustration · CC BY 4.0</text></g></svg>