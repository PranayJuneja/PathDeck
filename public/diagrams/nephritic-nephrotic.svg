<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description"><title id="title">Nephritic and nephrotic are clinical patterns</title><desc id="description">Side-by-side nephritic and nephrotic syndrome summaries emphasise inflammatory hematuria versus heavy protein leakage and their common clinical consequences.</desc><defs><marker id="slateArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#6a7a8c"/></marker><marker id="roseArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#9f4765"/></marker><marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#267b78"/></marker><marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#8170b5"/></marker></defs><rect width="1200" height="760" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="44" fill="#267b78" font-size="15" font-weight="700" text-anchor="start">PATH DECK  /  MECHANISMS</text><text x="44" y="91" fill="#203249" font-size="34" font-weight="700" text-anchor="start">Nephritic and nephrotic are clinical patterns</text><text x="44" y="125" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">They describe presentations, rather than a single histological diagnosis.</text><path d="M44 147H1156" fill="none" stroke="#d9e1e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="55" y="180" width="520" height="112" rx="16" fill="#f3dce4" stroke="#d9e1e9" stroke-width="2"/><rect x="56" y="181" width="6" height="110" rx="3" fill="#9f4765" stroke="#9f4765" stroke-width="2"/><text x="78" y="217" fill="#203249" font-size="24" font-weight="650" text-anchor="start">Nephritic pattern</text><text x="78" y="252" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Inflammatory glomerular injury</text><text x="78" y="281" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">predominates.</text><rect x="625" y="180" width="520" height="112" rx="16" fill="#e7e1f3" stroke="#d9e1e9" stroke-width="2"/><rect x="626" y="181" width="6" height="110" rx="3" fill="#8170b5" stroke="#8170b5" stroke-width="2"/><text x="648" y="217" fill="#203249" font-size="24" font-weight="650" text-anchor="start">Nephrotic pattern</text><text x="648" y="252" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Increased protein permeability</text><text x="648" y="281" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">predominates.</text><circle cx="315" cy="385" r="65" fill="#f3dce4" stroke="#9f4765" stroke-width="2"/><path d="M262 385Q290 325 320 385T368 385" fill="none" stroke="#8170b5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="885" cy="385" r="65" fill="#e7e1f3" stroke="#8170b5" stroke-width="2"/><path d="M832 385Q860 325 890 385T938 385" fill="none" stroke="#9f4765" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M315,454 L315,493" fill="none" stroke="#9f4765" stroke-width="3" marker-end="url(#roseArrow)"/><path d="M885,454 L885,493" fill="none" stroke="#8170b5" stroke-width="3" marker-end="url(#purpleArrow)"/><text x="95" y="528" fill="#203249" font-size="22" font-weight="400" text-anchor="start">Hematuria and red-cell casts</text><text x="95" y="560" fill="#203249" font-size="22" font-weight="400" text-anchor="start">Reduced filtration may cause oliguria</text><text x="95" y="592" fill="#203249" font-size="22" font-weight="400" text-anchor="start">Hypertension and variable proteinuria</text><text x="665" y="528" fill="#203249" font-size="22" font-weight="400" text-anchor="start">Heavy proteinuria</text><text x="665" y="560" fill="#203249" font-size="22" font-weight="400" text-anchor="start">Hypoalbuminemia and edema</text><text x="665" y="592" fill="#203249" font-size="22" font-weight="400" text-anchor="start">Hyperlipidemia and lipiduria may occur</text><path d="M44 693H1156" fill="none" stroke="#d9e1e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="720" fill="#6a7a8c" font-size="17" font-weight="400" text-anchor="start">Mixed presentations occur. Biopsy findings and clinical context determine the underlying disease.</text><text x="44" y="746" fill="#6a7a8c" font-size="14" font-weight="400" text-anchor="start">Schematic • not a photomicrograph</text><text x="1156" y="746" fill="#6a7a8c" font-size="14" font-weight="400" text-anchor="end">Original Path Deck illustration · CC BY 4.0</text></g></svg>