<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description"><title id="title">From adipose dysfunction to type 2 diabetes</title><desc id="description">A mechanism schematic links adipose dysfunction with insulin resistance, compensatory insulin secretion and later beta-cell dysfunction.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#6a7a8c" /></marker></defs><rect x="0" y="0" width="1200" height="760" rx="0" fill="#f5f7fa" stroke="#f5f7fa" stroke-width="2" /><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="44" font-size="15" fill="#267b78" font-weight="700" text-anchor="start">PATH DECK  /  MECHANISMS</text><text x="44" y="91" font-size="32" fill="#203249" font-weight="700" text-anchor="start">From adipose dysfunction to type 2 diabetes</text><text x="44" y="125" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">Insulin resistance and inadequate beta-cell compensation interact over time.</text><path d="M44 147 L1156 147" stroke="#d9e1e9" stroke-width="3" fill="none" /><rect x="44" y="180" width="335" height="140" rx="14" fill="#f3dce4" stroke="#d9e1e9" stroke-width="2" /><text x="66" y="216" font-size="24" fill="#203249" font-weight="650" text-anchor="start">Adipose dysfunction</text><text x="66" y="253" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">Abdominal fat can promote</text><text x="66" y="280" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">fatty-acid and inflammatory</text><text x="66" y="307" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">signals.</text><circle cx="100" cy="370" r="40" fill="#f3dce4" stroke="#9f4765" stroke-width="2" /><circle cx="130" cy="377" r="6" fill="#8170b5" stroke="#8170b5" stroke-width="2" /><circle cx="180" cy="375" r="49" fill="#f3dce4" stroke="#9f4765" stroke-width="2" /><circle cx="219" cy="382" r="6" fill="#8170b5" stroke="#8170b5" stroke-width="2" /><circle cx="265" cy="370" r="38" fill="#f3dce4" stroke="#9f4765" stroke-width="2" /><circle cx="293" cy="377" r="6" fill="#8170b5" stroke="#8170b5" stroke-width="2" /><text x="170" y="453" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="middle">Enlarged adipocytes</text><path d="M379 245 L435 245" stroke="#6a7a8c" stroke-width="3" fill="none" marker-end="url(#arr)" /><rect x="445" y="180" width="330" height="140" rx="14" fill="#dff0ee" stroke="#d9e1e9" stroke-width="2" /><text x="467" y="216" font-size="24" fill="#203249" font-weight="650" text-anchor="start">Insulin resistance</text><text x="467" y="253" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">Muscle, liver and adipose</text><text x="467" y="280" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">tissue respond less well</text><text x="467" y="307" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">to insulin.</text><path d="M775 245 L827 245" stroke="#6a7a8c" stroke-width="3" fill="none" marker-end="url(#arr)" /><rect x="837" y="180" width="319" height="140" rx="14" fill="#e6e1f2" stroke="#d9e1e9" stroke-width="2" /><text x="859" y="216" font-size="24" fill="#203249" font-weight="650" text-anchor="start">Early compensation</text><text x="859" y="253" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">Beta cells increase insulin</text><text x="859" y="280" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">output; glucose may remain</text><text x="859" y="307" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">near normal initially.</text><path d="M997 300 L997 370" stroke="#6a7a8c" stroke-width="3" fill="none" marker-end="url(#arr)" /><rect x="837" y="380" width="319" height="175" rx="14" fill="#f3dce4" stroke="#d9e1e9" stroke-width="2" /><text x="859" y="416" font-size="24" fill="#203249" font-weight="650" text-anchor="start">Beta-cell dysfunction</text><text x="859" y="453" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">Insulin secretion becomes</text><text x="859" y="480" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">insufficient for demand.</text><text x="859" y="507" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">Not an autoimmune loss</text><text x="859" y="534" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">as in typical type 1 diabetes.</text><path d="M837 455 L775 455" stroke="#6a7a8c" stroke-width="3" fill="none" marker-end="url(#arr)" /><rect x="445" y="380" width="330" height="175" rx="14" fill="white" stroke="#d9e1e9" stroke-width="2" /><text x="467" y="416" font-size="24" fill="#203249" font-weight="650" text-anchor="start">Persistent hyperglycemia</text><text x="467" y="453" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">Reduced glucose uptake and</text><text x="467" y="480" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">inadequately restrained</text><text x="467" y="507" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">hepatic glucose production</text><text x="467" y="534" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">contribute to type 2 diabetes.</text><rect x="105" y="575" width="990" height="85" rx="14" fill="white" stroke="#d9e1e9" stroke-width="2" /><text x="127" y="611" font-size="24" fill="#203249" font-weight="650" text-anchor="start">Risk does not equal destiny</text><text x="127" y="648" font-size="20" fill="#6a7a8c" font-weight="400" text-anchor="start">Genetics and other factors contribute; obesity is neither necessary nor sufficient for type 2 diabetes.</text><path d="M44 693 L1156 693" stroke="#d9e1e9" stroke-width="3" fill="none" /><text x="44" y="720" font-size="17" fill="#6a7a8c" font-weight="400" text-anchor="start">This is an illustrative pathway; progression and the relative mechanisms vary between people.</text><text x="44" y="746" font-size="14" fill="#6a7a8c" font-weight="400" text-anchor="start">Schematic • not a photomicrograph</text><text x="1156" y="746" font-size="14" fill="#6a7a8c" font-weight="400" text-anchor="end">Original Path Deck illustration · CC BY 4.0</text></g></svg>