<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description"><title id="title">Recognising patterns of necrosis</title><desc id="description">Six pattern summaries distinguish coagulative, liquefactive, caseous, fat and fibrinoid necrosis, and explain gangrene as a clinical term.</desc><defs><marker id="slateArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#6a7a8c" /></marker><marker id="roseArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#9f4765" /></marker><marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#267b78" /></marker><marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#8170b5" /></marker></defs><rect width="1200" height="760" fill="#f5f7fa" /><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="44" fill="#267b78" font-size="15" font-weight="700" text-anchor="start">PATH DECK  /  MECHANISMS</text><text x="44" y="91" fill="#203249" font-size="34" font-weight="700" text-anchor="start">Recognising patterns of necrosis</text><text x="44" y="125" fill="#6a7a8c" font-size="20" font-weight="400" text-anchor="start">Use architecture, debris, tissue type and clinical context together.</text><path d="M44 147H1156" fill="none" stroke="#d9e1e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="44" y="176" width="360" height="226" rx="16" fill="#ffffff" stroke="#d9e1e9" stroke-width="2" /><text x="62" y="208" fill="#203249" font-size="25" font-weight="650" text-anchor="start">Coagulative</text><rect x="68" y="228" width="45" height="40" rx="5" fill="#f3dce4" stroke="#9f4765" stroke-width="2" /><rect x="125" y="228" width="45" height="40" rx="5" fill="#f3dce4" stroke="#9f4765" stroke-width="2" /><rect x="182" y="228" width="45" height="40" rx="5" fill="#f3dce4" stroke="#9f4765" stroke-width="2" /><rect x="239" y="228" width="45" height="40" rx="5" fill="#f3dce4" stroke="#9f4765" stroke-width="2" /><rect x="296" y="228" width="45" height="40" rx="5" fill="#f3dce4" stroke="#9f4765" stroke-width="2" /><text x="62" y="294" fill="#6a7a8c" font-size="18" font-weight="400" text-anchor="start">Architecture persists</text><text x="62" y="317" fill="#6a7a8c" font-size="18" font-weight="400" text-anchor="start">briefly; nuclear detail is</text><text x="62" y="340" fill="#6a7a8c" font-size="18" font-weight="400" text-anchor="start">lost.</text><text x="62" y="369" fill="#267b78" font-size="17" font-weight="400" text-anchor="start">Typical: solid-organ infarcts;</text><text x="62" y="391" fill="#267b78" font-size="17" font-weight="400" text-anchor="start">brain is an exception.</text><rect x="420" y="176" width="360" height="226" rx="16" fill="#ffffff" stroke="#d9e1e9" stroke-width="2" /><text x="438" y="208" fill="#203249" font-size="25" font-weight="650" text-anchor="start">Liquefactive</text><path d="M444 251 Q510 218 570 250 T735 244" fill="none" stroke="#8170b5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><circle cx="452" cy="244" r="6" fill="#8170b5" stroke="#8170b5" stroke-width="2" /><circle cx="493" cy="260" r="6" fill="#8170b5" stroke="#8170b5" stroke-width="2" /><circle cx="534" cy="244" r="6" fill="#8170b5" stroke="#8170b5" stroke-width="2" /><circle cx="575" cy="260" r="6" fill="#8170b5" stroke="#8170b5" stroke-width="2" /><circle cx="616" cy="244" r="6" fill="#8170b5" stroke="#8170b5" stroke-width="2" /><circle cx="657" cy="260" r="6" fill="#8170b5" stroke="#8170b5" stroke-width="2" /><circle cx="698" cy="244" r="6" fill="#8170b5" stroke="#8170b5" stroke-width="2" /><text x="438" y="294" fill="#6a7a8c" font-size="18" font-weight="400" text-anchor="start">Enzymatic digestion destroys</text><text x="438" y="317" fill="#6a7a8c" font-size="18" font-weight="400" text-anchor="start">tissue architecture.</text><text x="438" y="369" fill="#267b78" font-size="17" font-weight="400" text-anchor="start">Typical: bacterial abscesses</text><text x="438" y="391" fill="#267b78" font-size="17" font-weight="400" text-anchor="start">and cerebral infarcts.</text><rect x="796" y="176" width="360" height="226" rx="16" fill="#ffffff" stroke="#d9e1e9" stroke-width="2" /><text x="814" y="208" fill="#203249" font-size="25" font-weight="650" text-anchor="start">Caseous</text><ellipse cx="976" cy="247" rx="126" ry="25" fill="#e7e1f3" stroke="#8170b5" stroke-width="2" /><circle cx="882" cy="243" r="3" fill="#6a7a8c" stroke="#6a7a8c" stroke-width="2" /><circle cx="902" cy="250" r="3" fill="#6a7a8c" stroke="#6a7a8c" stroke-width="2" /><circle cx="922" cy="257" r="3" fill="#6a7a8c" stroke="#6a7a8c" stroke-width="2" /><circle cx="942" cy="243" r="3" fill="#6a7a8c" stroke="#6a7a8c" stroke-width="2" /><circle cx="962" cy="250" r="3" fill="#6a7a8c" stroke="#6a7a8c" stroke-width="2" /><circle cx="982" cy="257" r="3" fill="#6a7a8c" stroke="#6a7a8c" stroke-width="2" /><circle cx="1002" cy="243" r="3" fill="#6a7a8c" stroke="#6a7a8c" stroke-width="2" /><circle cx="1022" cy="250" r="3" fill="#6a7a8c" stroke="#6a7a8c" stroke-width="2" /><circle cx="1042" cy="257" r="3" fill="#6a7a8c" stroke="#6a7a8c" stroke-width="2" /><circle cx="1062" cy="243" r="3" fill="#6a7a8c" stroke="#6a7a8c" stroke-width="2" /><text x="814" y="294" fill="#6a7a8c" font-size="18" font-weight="400" text-anchor="start">Amorphous granular debris</text><text x="814" y="317" fill="#6a7a8c" font-size="18" font-weight="400" text-anchor="start">replaces tissue.</text><text x="814" y="369" fill="#267b78" font-size="17" font-weight="400" text-anchor="start">Often within granulomas,</text><text x="814" y="391" fill="#267b78" font-size="17" font-weight="400" text-anchor="start">including tuberculosis.</text><rect x="44" y="423" width="360" height="226" rx="16" fill="#ffffff" stroke="#d9e1e9" stroke-width="2" /><text x="62" y="455" fill="#203249" font-size="25" font-weight="650" text-anchor="start">Fat</text><circle cx="99" cy="495" r="23" fill="#ffffff" stroke="#9f4765" stroke-width="2" /><circle cx="116" cy="505" r="5" fill="#267b78" stroke="#267b78" stroke-width="2" /><circle cx="169" cy="495" r="23" fill="#ffffff" stroke="#9f4765" stroke-width="2" /><circle cx="186" cy="505" r="5" fill="#267b78" stroke="#267b78" stroke-width="2" /><circle cx="239" cy="495" r="23" fill="#ffffff" stroke="#9f4765" stroke-width="2" /><circle cx="256" cy="505" r="5" fill="#267b78" stroke="#267b78" stroke-width="2" /><circle cx="309" cy="495" r="23" fill="#ffffff" stroke="#9f4765" stroke-width="2" /><circle cx="326" cy="505" r="5" fill="#267b78" stroke="#267b78" stroke-width="2" /><text x="62" y="541" fill="#6a7a8c" font-size="18" font-weight="400" text-anchor="start">Damaged adipocytes release</text><text x="62" y="564" fill="#6a7a8c" font-size="18" font-weight="400" text-anchor="start">fat; calcium soaps may form.</text><text x="62" y="616" fill="#267b78" font-size="17" font-weight="400" text-anchor="start">Examples: pancreatitis or</text><text x="62" y="638" fill="#267b78" font-size="17" font-weight="400" text-anchor="start">traumatic fat injury.</text><rect x="420" y="423" width="360" height="226" rx="16" fill="#ffffff" stroke="#d9e1e9" stroke-width="2" /><text x="438" y="455" fill="#203249" font-size="25" font-weight="650" text-anchor="start">Fibrinoid</text><ellipse cx="600" cy="495" rx="90" ry="24" fill="#f3dce4" stroke="#9f4765" stroke-width="2" /><ellipse cx="600" cy="495" rx="65" ry="12" fill="#ffffff" stroke="#8170b5" stroke-width="2" /><text x="438" y="541" fill="#6a7a8c" font-size="18" font-weight="400" text-anchor="start">Bright eosinophilic material</text><text x="438" y="564" fill="#6a7a8c" font-size="18" font-weight="400" text-anchor="start">accumulates in vessel walls.</text><text x="438" y="616" fill="#267b78" font-size="17" font-weight="400" text-anchor="start">Associated with immune vascular</text><text x="438" y="638" fill="#267b78" font-size="17" font-weight="400" text-anchor="start">injury.</text><rect x="796" y="423" width="360" height="226" rx="16" fill="#ffffff" stroke="#d9e1e9" stroke-width="2" /><text x="814" y="455" fill="#203249" font-size="25" font-weight="650" text-anchor="start">Gangrene</text><rect x="831" y="475" width="285" height="40" rx="5" fill="#e7e1f3" stroke="#8170b5" stroke-width="2" /><path d="M961 475V515" fill="none" stroke="#9f4765" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5" /><text x="814" y="541" fill="#6a7a8c" font-size="18" font-weight="400" text-anchor="start">A clinical term, rather than</text><text x="814" y="564" fill="#6a7a8c" font-size="18" font-weight="400" text-anchor="start">a separate microscopic</text><text x="814" y="587" fill="#6a7a8c" font-size="18" font-weight="400" text-anchor="start">pattern.</text><text x="814" y="616" fill="#267b78" font-size="17" font-weight="400" text-anchor="start">Dry: ischemia; wet:</text><text x="814" y="638" fill="#267b78" font-size="17" font-weight="400" text-anchor="start">superimposed infection.</text><path d="M44 693H1156" fill="none" stroke="#d9e1e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="44" y="720" fill="#6a7a8c" font-size="17" font-weight="400" text-anchor="start">These sketches communicate patterns; they are not substitutes for actual slide morphology.</text><text x="44" y="746" fill="#6a7a8c" font-size="14" font-weight="400" text-anchor="start">Schematic • not a photomicrograph</text><text x="1156" y="746" fill="#6a7a8c" font-size="14" font-weight="400" text-anchor="end">Original Path Deck illustration · CC BY 4.0</text></g></svg>